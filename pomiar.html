<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomiar — Forkast</title>
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<script src="lib/tailwind.js"></script>
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
<link rel="stylesheet" href="styl.css">
</head>

<!-- STRONA TYMCZASOWA — pomiar czasu wersji restauracyjnej (decyzja 106).
     Nie ma do niej wejścia z apki; otwiera się ją z adresu /pomiar.html.
     Jedno danie, jeden prompt, liczba z telefonu. Do skasowania po pomiarze
     razem z flagą `pomiar` w netlify/edge-functions/zapytaj-ai.js. -->
<body class="h-full bg-stone-50 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-100">

<main class="mx-auto max-w-lg space-y-4 p-4">
  <h1 class="text-xl font-semibold">Pomiar 3: tortilla, kształt + pushback</h1>
  <p class="text-sm text-stone-600 dark:text-stone-400">
    Prompt z <code>prompt.js</code>, tą samą drogą co dodawanie dania. Sprawdza kształt
    (decyzja 109) i przy rozjeździe robi jedną rundę poprawki. Stół: <span id="stol" class="font-mono"></span>
  </p>

  <button id="start" class="w-full rounded-xl bg-emerald-600 px-4 py-3 text-white disabled:opacity-50">
    Zmierz
  </button>

  <p id="zegar" class="font-mono text-3xl tabular-nums">0,0 s</p>

  <section id="wynik" hidden class="space-y-3">
    <pre id="czasy" class="overflow-x-auto rounded-lg bg-stone-100 p-3 text-xs dark:bg-stone-900"></pre>
    <p id="ocena" class="text-sm"></p>
    <textarea id="tekst" readonly rows="18"
      class="w-full rounded-lg border border-stone-300 bg-white p-2 font-mono text-xs dark:border-stone-700 dark:bg-stone-900"></textarea>
    <button id="kopiuj" class="w-full rounded-xl border border-stone-300 px-4 py-3 dark:border-stone-700">
      Skopiuj odpowiedź i czasy
    </button>
  </section>

  <p id="blad" hidden class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800
     dark:border-red-800/50 dark:bg-red-900/25 dark:text-red-200"></p>
</main>

<script type="module">
import { kodStolu } from "./baza.js";
import { PRODUKTY } from "./produkty.js";
import { WYDANIE } from "./wersja.js";
import { zbudujPromptRestauracyjny, zbudujPoprawkeRestauracyjna } from "./prompt.js";
import { wyciagnijJSON, sprawdzAkcenty } from "./parser.js";

const $ = (id) => document.getElementById(id);
const kodDomu = kodStolu();
$("stol").textContent = kodDomu || "BRAK — załóż albo wejdź do stołu na ekranie głównym";
if (!kodDomu) $("start").disabled = true;

/* Danie testowe z decyzji 108 — w kształcie, w jakim leży w bazie. */
const TORTILLA = {
  nazwa: "Tortilla z kurczakiem i warzywami",
  porcje: 2,
  skladniki: [
    { produkt: "Tortilla pszenna", gramy: 120 },
    { produkt: "Pierś z kurczaka", gramy: 250 },
    { produkt: "Papryka",          gramy: 150 },
    { produkt: "Cebula",           gramy: 60 },
    { produkt: "Jogurt grecki",    gramy: 80 },
  ],
  kroki: [
    "Pokrój pierś z kurczaka w paski, a paprykę i cebulę w cienkie plastry.",
    "Podsmaż kurczaka na patelni (7/9) 6 minut do temperatury wewnętrznej 74°C.",
    "Dodaj paprykę i cebulę, smaż razem 4 minuty.",
    "Rozgrzej tortillę pszenną na suchej patelni 20 sekund z każdej strony.",
    "Nałóż nadzienie na tortillę, polej jogurtem greckim i zwiń.",
  ],
};

const PROMPT = zbudujPromptRestauracyjny(TORTILLA, PRODUKTY);
const sek = (ms) => (ms / 1000).toFixed(1).replace(".", ",") + " s";
let ostatni = "";

/* Jedno wywołanie tą samą drogą co dodawanie dania (bez flagi pomiar — decyzja 107
   pokazała, że jest niepotrzebna). Zwraca tekst odpowiedzi i czasy. */
async function zapytaj(prompt) {
  const start = Date.now();
  const odp = await fetch("/api/zapytaj-ai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, kodDomu, obrazy: [] }),
  });
  const naTelefonie = Date.now() - start;
  let json;
  try { json = await odp.json(); }
  catch { throw new Error(`Odpowiedź nie jest JSON-em (HTTP ${odp.status}) — ${WYDANIE}`); }
  if (!odp.ok) throw new Error(`${json.blad || "Błąd funkcji"} (HTTP ${odp.status}) — ${WYDANIE}`);
  return { tekst: json.tekst, czasy: { naTelefonie, ...json.czasy, koniec: json.koniec, model: json.model } };
}

/* Kształt — nie jakość. Jakość ocenia Miłosz (105). Zwraca listę rozjazdów (109). */
function ocenKsztalt(tekst) {
  const d = wyciagnijJSON(tekst);
  const kroki = Array.isArray(d.kroki) ? d.kroki : [];
  const akcenty = Array.isArray(d.akcenty) ? d.akcenty.map(a => ({ produkt: String(a.produkt ?? ""), gramy: Number(a.gramy) })) : [];
  const bledy = sprawdzAkcenty(kroki, TORTILLA.skladniki, akcenty);
  return { bledy, opis: `kroków: ${kroki.length}, akcentów: ${akcenty.length}, nowych produktów: ${d.noweProdukty?.length ?? 0}, znaków: ${tekst.length}` };
}

function ocenBezpiecznie(p) {
  try { return ocenKsztalt(p.tekst); }
  catch (e) { return { bledy: [`JSON niepoprawny: ${e.message} (koniec: ${p.czasy.koniec})`], opis: `znaków: ${p.tekst.length}` }; }
}

$("start").addEventListener("click", async () => {
  $("start").disabled = true;
  $("wynik").hidden = true;
  $("blad").hidden = true;
  const start = Date.now();
  const tyk = setInterval(() => { $("zegar").textContent = sek(Date.now() - start); }, 100);
  const log = [];

  try {
    const p1 = await zapytaj(PROMPT);
    const o1 = ocenBezpiecznie(p1);
    log.push(`PRÓBA 1 — ${o1.opis}\n${JSON.stringify(p1.czasy)}\n` +
             (o1.bledy.length ? `ROZJAZDY (${o1.bledy.length}):\n- ${o1.bledy.join("\n- ")}` : "KSZTAŁT ZGODNY"));

    let koncowy = p1.tekst, wynik = o1;
    if (o1.bledy.length) {
      /* Pushback: jedna runda, ten sam prompt + jego odpowiedź + rozjazdy w liczbach. */
      const p2 = await zapytaj(zbudujPoprawkeRestauracyjna(PROMPT, p1.tekst, o1.bledy));
      const o2 = ocenBezpiecznie(p2);
      log.push(`PRÓBA 2 (po pushbacku) — ${o2.opis}\n${JSON.stringify(p2.czasy)}\n` +
               (o2.bledy.length ? `NADAL ROZJAZDY (${o2.bledy.length}) → NIE UDAŁO SIĘ:\n- ${o2.bledy.join("\n- ")}` : "KSZTAŁT ZGODNY PO POPRAWCE"));
      koncowy = p2.tekst; wynik = o2;
    }

    clearInterval(tyk);
    $("zegar").textContent = sek(Date.now() - start) + " łącznie";
    $("czasy").textContent = log.join("\n\n");
    $("ocena").textContent = wynik.bledy.length
      ? "Wynik: NIE UDAŁO SIĘ — danie zostałoby bez wersji restauracyjnej (103)."
      : "Wynik: kształt zgodny.";
    $("tekst").value = koncowy;
    ostatni = `WYDANIE ${WYDANIE}\n\n${log.join("\n\n")}\n\nODPOWIEDŹ KOŃCOWA\n${koncowy}`;
    $("wynik").hidden = false;
  } catch (e) {
    clearInterval(tyk);
    $("blad").textContent = e.message;
    $("blad").hidden = false;
  } finally {
    $("start").disabled = false;
  }
});

$("kopiuj").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(ostatni); $("kopiuj").textContent = "Skopiowane"; }
  catch { $("tekst").select(); $("kopiuj").textContent = "Zaznaczone — skopiuj ręcznie"; }
});
</script>
</body>
</html>
