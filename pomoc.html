<!-- Okienko pomocy — jeden egzemplarz, wstrzykiwany do każdego ekranu tak samo
     jak sprite ikon. Sterowane przez `pomocKlucz` w stanie ekranu. -->
<div x-show="pomocKlucz" @click.self="pomocKlucz = null" x-transition.opacity.duration.200ms
     class="fixed inset-0 z-[60] flex items-end justify-center bg-stone-900/50 backdrop-blur-sm
            md:items-center">
  <div x-show="pomocKlucz" x-transition:enter="transition ease-out duration-250"
       x-transition:enter-start="translate-y-full md:translate-y-4 md:opacity-0"
       x-data="przeciagany(() => pomocKlucz = null)" x-bind="uchwyty"
       class="plynne bez-paska max-h-[86vh] w-full max-w-lg overflow-y-auto rounded-t-[1.75rem]
              bg-stone-50 px-6 pt-3 dark:bg-stone-950 md:rounded-[1.75rem]"
       style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-stone-300 dark:bg-stone-700 md:hidden"></div>
    <template x-if="pomocKlucz && POMOC[pomocKlucz]">
      <div>
        <h3 class="text-[1.25rem] font-bold leading-tight" x-text="POMOC[pomocKlucz].tytul"></h3>
        <template x-for="a in POMOC[pomocKlucz].akapity" :key="a">
          <p class="mt-3 text-[1rem] leading-relaxed text-stone-600 dark:text-stone-400"
             x-text="a"></p>
        </template>
        <button type="button" @click="pomocKlucz = null"
                class="mt-5 min-h-[2.9rem] w-full rounded-xl bg-emerald-700 font-bold text-white
                       dark:bg-emerald-600" x-text="t('Jasne')"></button>
      </div>
    </template>
  </div>
</div>
