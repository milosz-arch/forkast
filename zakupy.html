<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forkast">
<title>Zakupy — Forkast</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikona.svg">
<link rel="icon" href="ikona.svg" type="image/svg+xml">

<!-- Biblioteki lokalnie, nie z CDN: lista zakupów ma działać w sklepie bez
     zasięgu, a service worker cache'uje tylko własną domenę.
     Alpine NIE jest tu ładowany — importuje go moduł na dole strony i sam
     go startuje, po zarejestrowaniu danych. Powód w komentarzu przy imporcie. -->
<script src="lib/tailwind.js"></script>
<!-- Ta jedna deklaracja MUSI być tutaj, nie w styl.css.
     Przeglądarkowy Tailwind kompiluje wyłącznie bloki <style type="text/tailwindcss">
     w dokumencie — w zewnętrznym arkuszu jest ignorowana, a wtedy `dark:` działa
     po ustawieniu systemu i przełącznik w Ustawieniach nic nie zmienia. -->
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
<link rel="stylesheet" href="styl.css">
</head>

<body class="h-full bg-stone-50 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-100"
    x-data="ekranZakupy" x-init="init()" x-cloak>

<div id="ikony"></div>
<div id="pomoc"></div>
<p aria-live="polite" class="sr-only" x-text="komunikat"></p>

<div class="flex h-dvh flex-col overflow-hidden md:flex-row">

  <!-- ================= NAWIGACJA BOCZNA (desktop) ================= -->
  <nav class="hidden shrink-0 flex-col gap-1.5 border-r border-stone-200/70 bg-white p-5
            md:flex md:w-60 lg:w-64 dark:border-stone-800 dark:bg-stone-900"
     :aria-label="t('Nawigacja główna')">
    <p class="mb-4 border-b border-stone-100 pb-5 text-lg font-black tracking-tight
            text-emerald-700 dark:border-stone-800 dark:text-emerald-400">Forkast</p>
    <template x-for="z in zakladki" :key="z.id">
    <a :href="zamknieta(z.id) ? 'talia.html' : z.plik"
       :aria-current="z.id === ekran ? 'page' : null"
       :aria-disabled="zamknieta(z.id) ? 'true' : null"
       class="flex h-12 items-center gap-3 rounded-xl px-3.5 no-underline transition"
       :class="zamknieta(z.id) ? 'text-stone-300 dark:text-stone-700'
               : z.id === ekran
               ? 'bg-emerald-50 font-bold text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-400'
               : 'text-stone-500 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800'">
      <svg class="ikona"><use :href="'#i-' + z.id"/></svg>
      <span x-text="t(z.nazwa)"></span>
      <span x-show="z.id === ekran" class="ml-auto size-1.5 rounded-full bg-emerald-600 dark:bg-emerald-400"></span>
    </a>
    </template>
    <a href="ustawienia.html"
       class="mt-1 flex h-12 items-center gap-3 rounded-xl px-3.5 text-stone-500 no-underline
              transition hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800">
      <svg class="ikona"><use href="#i-ustawienia"/></svg>
      <span x-text="t('Ustawienia')"></span>
    </a>
  </nav>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col">

    <!-- ========================= NAGŁÓWEK ========================= -->
    <header class="shrink-0 overflow-hidden rounded-b-[1.75rem] bg-gradient-to-br
                 from-emerald-600 via-emerald-700 to-emerald-800 px-5 text-white
                 shadow-lg shadow-emerald-900/20 md:rounded-none"
          style="padding-top:calc(1.15rem + env(safe-area-inset-top,0px)); padding-bottom:1.4rem">
    <!-- KONTROLKI NA WŁASNEJ LINII, NIE NA TYTULE.

         Do 8 sierpnia stały bezwzględnie w prawym górnym rogu, na sztywnej siatce
         co 3.2rem. Dwie wady, obie zgłoszone z prawdziwego telefonu (decyzja 74):
         przy dłuższym tytule („Lista zakupów”) kontrolki po prostu na nim leżały,
         a dwie o tej samej wartości `right` leżały na sobie nawzajem.

         Teraz to zwykły wiersz: napis „Forkast” po lewej, kontrolki po prawej,
         tytuł pod spodem. Nic nie może na nic wejść, bo nic nie jest wyjęte
         z układu strony — i nie trzeba pamiętać o żadnej siatce. -->
    <div class="flex min-h-[2.75rem] items-center gap-2">
      <p class="text-[0.68rem] font-extrabold uppercase tracking-[0.24em] text-white/80">Forkast</p>
      <div class="ml-auto flex shrink-0 items-center gap-2">
        <button type="button" x-show="ekranObslugiwany" @click="przelaczEkran()"
            :aria-pressed="ekranSwieci.toString()"
            :aria-label="ekranSwieci ? t('Ekran nie gaśnie. Dotknij, żeby wyłączyć.')
                                     : t('Ekran gaśnie. Dotknij, żeby świecił.')"
            class="flex min-h-[2.5rem] items-center gap-1.5 rounded-full border px-3
                   text-[0.68rem] font-bold backdrop-blur-md transition"
            :class="ekranSwieci ? 'border-white bg-white text-emerald-800'
                                : 'border-white/40 bg-white/15 text-white/90'">
      <svg class="ikona ikona-sm"><use :href="ekranSwieci ? '#i-slonce' : '#i-ksiezyc'"/></svg>
      <span class="hidden min-[380px]:inline" x-text="ekranSwieci ? t('Świeci') : t('Gaśnie')"></span>
    </button>
        <button type="button" @click="pomocKlucz = 'zakupy'"
              :aria-label="t('Jak to działa')"
              class="flex size-11 items-center justify-center rounded-full border
                     border-white/35 bg-white/15 text-[1rem] font-bold text-white
                     backdrop-blur-md transition active:scale-95">i</button>
        <a href="ustawienia.html" :aria-label="t('Ustawienia')"
         class="flex size-11 items-center justify-center rounded-full border
                border-white/35 bg-white/15 text-white no-underline backdrop-blur-md
                transition active:scale-95">
        <svg class="ikona ikona-sm"><use href="#i-ustawienia"/></svg>
      </a>
      </div>
    </div>
    <h1 class="mt-1.5 text-[1.75rem] font-bold leading-tight tracking-tight" x-text="tytul"></h1>
    <p class="mt-1 max-w-[36ch] text-[0.82rem] leading-snug text-white/85" x-text="opis"></p>


    </header>

    <!-- ========================== TREŚĆ ========================== -->
    <main class="plynne bez-paska min-h-0 flex-1 overflow-y-auto scroll-smooth px-4 pt-5 md:px-8"
        style="padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))">
    <div class="mx-auto w-full max-w-2xl">

        <!-- Duża liczba u góry: po to człowiek wchodzi na ten ekran w sklepie.
             Wcześniej ta informacja była podpisem drobnym drukiem pod paskiem,
             czyli najmniej ważnym elementem — a jest najważniejszym. -->
        <div class="mb-4 flex items-end gap-3">
          <!-- Licznik przewijany, nie przeskakujący. Liczba, która przeskakuje
               z 6 na 7, nie mówi nic; przewijająca się mówi „przybyło” — a to jest
               informacja, po którą człowiek patrzy na ten ekran w sklepie. -->
          <p class="licznik liczba-glowna text-emerald-700 dark:text-emerald-400"
             :aria-label="`${doKupienia.filter(p => p.wKoszyku).length} w koszyku`">
            <template x-for="(c, i) in String(doKupienia.filter(p => p.wKoszyku).length).split('')"
                      :key="i">
              <span class="cyfra" aria-hidden="true">
                <span class="kolumna" :style="`--c:${c}`">
                  <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
                  <span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
                </span>
              </span>
            </template>
          </p>
          <p class="liczba-drobna pb-1.5" x-text="`/ ${doKupienia.length}`"></p>
          <div class="min-w-0 flex-1 pb-1.5 text-right">
            <p class="text-[0.82rem] font-semibold leading-tight" x-text="opisKoszyka"></p>
            <p x-show="pozycje.length - doKupienia.length > 0"
               class="mt-0.5 text-[0.82rem] text-stone-400"
               x-text="`${pozycje.length - doKupienia.length} już macie w domu`"></p>
          </div>
        </div>

        <div class="mb-5">
          <div class="pasek" x-data="pasek" x-effect="ustaw(postep)"
                 :class="{ przyrost, gotowe }"
                 :style="`--postep:${postep}`"
                 role="progressbar" :aria-valuenow="postep" aria-valuemin="0" aria-valuemax="100"
                 :aria-label=opisKoszyka>
              <i></i><u></u><b></b>
            </div>
        </div>

      <!-- Uwagi z liczenia (np. danie zniknęło z bazy) -->
      <template x-for="u in pominiete" :key="u">
        <div class="mb-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-[1rem]
                    text-amber-900 dark:border-amber-800/50 dark:bg-amber-900/25 dark:text-amber-200"
             x-text="u"></div>
      </template>

      <!-- Skeleton: kształt listy, nie napis „ładuję” -->
      <div x-show="laduje" class="space-y-2.5">
        <template x-for="n in 6" :key="n">
          <div class="szkielet flex items-center gap-4 rounded-2xl border border-stone-100 bg-white
                      p-4 shadow-sm dark:border-stone-800 dark:bg-stone-900">
            <div class="size-6 shrink-0 rounded-lg bg-stone-200 dark:bg-stone-800"></div>
            <div class="flex-1 space-y-2">
              <div class="h-3.5 w-2/5 rounded-full bg-stone-200 dark:bg-stone-800"></div>
              <div class="h-2.5 w-3/5 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            </div>
            <div class="h-3.5 w-12 rounded-full bg-stone-200 dark:bg-stone-800"></div>
          </div>
        </template>
      </div>

      <!-- Pusto -->
      <div x-show="!laduje && !pozycje.length" x-transition
           class="rounded-2xl border border-stone-100 bg-white p-8 text-center shadow-sm
                  dark:border-stone-800 dark:bg-stone-900">
        <p class="text-stone-500 dark:text-stone-400" x-text="t('Nic do kupienia. Ułóż jadłospis, a lista policzy się sama — albo dopisz coś ręcznie na dole.')"></p>
        <a href="jadlospis.html" class="btn-glowny mt-5 no-underline"><span x-text="t('Przejdź do jadłospisu')" data-zapas>Przejdź do jadłospisu</span></a>
      </div>

      <!-- Lista -->
      <div x-show="!laduje && pozycje.length" class="space-y-5 pb-5">
        <template x-for="g in wgDzialu" :key="g.dzial">
          <section>
            <!-- Licznik przy dziale: widać, ile zostało, bez liczenia wierszy. -->
            <h2 class="naglowek-dzialu mb-2 ml-1 text-stone-400 dark:text-stone-500">
              <span x-text="g.dzial"></span>
              <span class="ml-auto normal-case tracking-normal"
                    :class="zostaloWDziale(g) === 0 ? 'text-emerald-700 dark:text-emerald-400'
                                                    : 'text-stone-400'"
                    x-text="zostaloWDziale(g) === 0 ? t('✓ gotowe') : `zostało ${zostaloWDziale(g)}`"></span>
            </h2>
            <ul role="list" class="overflow-hidden rounded-2xl border border-stone-100 bg-white
                                   shadow-sm dark:border-stone-800 dark:bg-stone-900">
              <template x-for="p in g.pozycje" :key="p.produkt">
                <li class="flex items-stretch border-b border-stone-100 last:border-0
                           dark:border-stone-800">
                  <button type="button" @click="odhacz(p)" :aria-pressed="p.wKoszyku.toString()"
                          :aria-label="p.dopisek
                            ? `${p.produkt}, dopisane ręcznie. ${p.wKoszyku ? t('W koszyku') : t('Do kupienia')}.`
                            : p.wDomu
                              ? `${p.produkt}. Macie w domu ${p.ileWDomu}, nie trzeba kupować.`
                              : `${p.produkt}, do kupienia ${p.ileDoKupienia}${p.masz > 0 ? `, w domu ${p.ileWDomu}` : ''}. ${p.wKoszyku ? t('W koszyku') : t('Do kupienia')}.`"
                          class="flex min-h-[3.25rem] w-full items-center gap-4 px-4 text-left transition
                                 active:bg-stone-50 dark:active:bg-stone-800/60"
                          :class="p.wKoszyku ? 'opacity-55' : ''">
                    <!-- Stan nie zależy od samego koloru: kolor + ptaszek
                         + przekreślenie + pozycja na liście. -->
                    <span class="flex size-6 shrink-0 items-center justify-center rounded-lg border-2
                                 transition-colors"
                          :class="p.wKoszyku
                            ? 'border-emerald-600 bg-emerald-600 text-white dark:border-emerald-500 dark:bg-emerald-500'
                            : 'border-stone-300 dark:border-stone-600'">
                      <svg x-show="p.wKoszyku" class="ikona" style="width:.8rem;height:.8rem;stroke-width:3">
                        <use href="#i-ptaszek"/></svg>
                    </span>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate font-medium"
                            :class="p.wKoszyku ? 'text-stone-400 line-through dark:text-stone-500' : ''"
                            x-text="p.produkt"></span>
                      <span class="block truncate text-[0.82rem] text-stone-400" x-text="p.zDan"></span>
                    </span>
                    <!-- Ilość po odjęciu spiżarni. Gdy coś macie w domu, liczba mówi,
                         ILE DOŁOŻYĆ, a w nawiasie stoi, ile już jest — żeby było widać,
                         że apka odjęła, a nie że przepis zmalał (decyzja 70). -->
                    <span class="shrink-0 text-right">
                      <!-- Dopisana ręcznie pozycja nie ma gramatury i nie udaje, że ma.
                           Wpisanie tu zera albo kreski wyglądałoby jak brak danych,
                           a to jest brak POJĘCIA: pasta do zębów nie ma ilu gramów. -->
                      <span x-show="!p.dopisek || p.ileDoKupienia"
                            class="block font-bold tabular-nums text-emerald-800 dark:text-emerald-400"
                            x-text="p.wDomu ? 'mamy' : p.ileDoKupienia"></span>
                      <span x-show="p.masz > 0"
                            class="block text-[0.68rem] tabular-nums text-stone-400 dark:text-stone-500"
                            x-text="p.wDomu ? `${p.ileWDomu} w domu` : `${p.ileWDomu} jest w domu`"></span>
                    </span>
                  </button>

                  <!-- KRZYŻYK, TYLKO PRZY DOPISANYCH RĘCZNIE.

                       29 sierpnia ustaliliśmy, że odhaczenie takiej pozycji ją KASUJE
                       (decyzja 90). Miłosz zmienił zdanie następnego dnia i słusznie:
                       odhaczenie w sklepie znaczy „mam to w koszyku”, a nie „usuń
                       z listy”, i po pomyłce nie było jak wrócić. Rozdzielone tak samo
                       jak w jadłospisie — po lewej odhaczasz, po prawej usuwasz.

                       Przycisk stoi OBOK tamtego, nie w środku: przycisk w przycisku
                       to nieprawidłowy HTML i na iPhonie potrafi zjeść dotknięcie. -->
                  <button x-show="p.dopisek" type="button" @click="skreslDopisek(p)"
                          :aria-label="`Usuń ${p.produkt} z listy`"
                          class="flex w-12 shrink-0 items-center justify-center text-stone-300
                                 transition active:scale-90 dark:text-stone-600">
                    <svg class="ikona ikona-sm"><use href="#i-x"/></svg>
                  </button>
                </li>
              </template>
            </ul>
          </section>
        </template>

      </div>

      <!-- DOPISYWANIE RĘCZNE.

             Pasta do zębów, worki na śmieci, karma dla kota. Do 29 sierpnia lista
             liczyła się WYŁĄCZNIE z jadłospisu, więc takich rzeczy nie dało się
             do niej dopisać — a człowiek idący do sklepu i tak je ze sobą ma,
             tylko w innej aplikacji albo w głowie.

             Pole stoi POD listą, bo dopisuje się rzadko, a patrzy w listę ciągle.
             Rozpoznane jedzenie trafia do swojego działu, reszta do „Dopisane”.

             POZA blokiem listy, nie w środku: ten blok ma `x-show` na niepustej
             liście, więc pole schowałoby się dokładnie wtedy, gdy jest najbardziej
             potrzebne — przy pustej liście, czyli u kogoś, kto nie układa jadłospisu
             i chce od apki tylko listy zakupów. Pierwszej pozycji nie dałoby się
             dopisać nigdy. -->
      <div x-show="!laduje">
        <form @submit.prevent="dopisz()" class="flex gap-2">
          <input type="text" x-model="nowyDopisek" maxlength="100"
                 :placeholder="t('Dopisz coś do listy — np. pasta do zębów')"
                 :aria-label="t('Dopisz pozycję do listy zakupów')"
                 class="min-h-[2.9rem] w-full min-w-0 flex-1 rounded-xl border-2 border-stone-200
                        bg-white px-4 text-[17px] outline-none transition focus:border-emerald-600
                        focus:ring-4 focus:ring-emerald-500/15 dark:border-stone-700
                        dark:bg-stone-900 dark:text-stone-100">
          <!-- ILE CZEGO: tekst, nie liczba.

               Pole na samą liczbę zakładało, że wszystko dopisane liczy się na sztuki —
               a kawa i karma dla kota liczą się na wagę, mleko na litry. Tu wpisujesz
               to, co chcesz zobaczyć w sklepie: „3”, „500 g”, „2 opakowania”. Apka
               tego nie parsuje i nie musi: ta wartość nigdzie dalej nie liczy. -->
          <input type="text" x-model="nowaMiara" maxlength="20"
                 :placeholder="t('ile')"
                 :aria-label="t('Ile — sztuk, gramów, opakowań')"
                 class="min-h-[2.9rem] w-20 shrink-0 rounded-xl border-2 border-stone-200
                        bg-white px-2 text-center text-[17px] outline-none transition
                        focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/15
                        dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
          <button type="submit" :disabled="!nowyDopisek.trim()"
                  :aria-label="t('Dopisz do listy')"
                  class="flex min-h-[2.9rem] shrink-0 items-center justify-center rounded-xl
                         bg-emerald-700 px-4 font-bold text-white transition active:scale-[0.98]
                         disabled:opacity-40 dark:bg-emerald-600" x-text="t('Dopisz')"></button>
        </form>
      </div>

      <!-- ============ ZAPASY W SPIŻARNI DOMOWEJ ============

           Stała sekcja na dole listy, nie wysuwane okienko. Poprzednia wersja
           chowała to za ikoną w nagłówku — czyli za czymś, o czym trzeba wiedzieć,
           że istnieje. Miłosz po pierwszym użyciu: „spiżarnia jest bardzo user NIE
           friendly, wolałbym to jako stałą kategorię na dole listy zakupów, która
           nigdy nie znika” (decyzja 74).

           Sekcja jest widoczna ZAWSZE, także przy pustej liście zakupów — zapas
           w domu leży tam niezależnie od tego, czy akurat jest co kupować. -->
      <section class="mt-8">
        <h2 class="naglowek-dzialu mb-2 ml-1 text-stone-400 dark:text-stone-500">
          <span x-text="t('Zapasy w spiżarni domowej')"></span>
          <button type="button" @click="pomocKlucz = 'spizarnia'" :aria-label="t('Po co spiżarnia')"
                  class="ml-auto flex size-6 items-center justify-center rounded-full border
                         border-stone-300 text-[0.68rem] font-bold text-stone-400 normal-case
                         transition active:scale-95 dark:border-stone-700">i</button>
        </h2>

        <div class="overflow-hidden rounded-2xl border border-stone-100 bg-white shadow-sm
                    dark:border-stone-800 dark:bg-stone-900">
          <p class="px-4 pt-4 text-[0.82rem] leading-snug text-stone-500 dark:text-stone-400" x-text="t('Wpiszcie, ile czego macie w domu. Lista wyżej odejmie to od zakupów, żeby nie kazała Wam kupować kilograma mąki co tydzień.')"></p>

          <!-- Dodawanie.
               `min-w-0` przy polu tekstowym nie jest ozdobą: element w układzie flex
               domyślnie NIE kurczy się poniżej swojej naturalnej szerokości, a pole
               tekstowe ma ją sporą. Bez tego pole „gramy” było wypychane poza ekran —
               przy 390 px o 29 px, przy 320 px o 99 px (decyzja 73). -->
          <div class="flex gap-2 px-4 pt-3">
            <input type="text" x-model="nowyProdukt" list="produkty-spizarnia" :placeholder="t('Produkt')"
                   class="min-h-[2.9rem] min-w-0 flex-1 rounded-xl border-2 border-stone-200 bg-white px-4
                          text-[17px] outline-none transition focus:border-emerald-600
                          dark:border-stone-700 dark:bg-stone-950 dark:text-stone-100">
            <input type="number" x-model.number="nowaIlosc" :placeholder="t('gramy')" min="1"
                   @keydown.enter="dodajDoSpizarni()"
                   class="min-h-[2.9rem] w-24 shrink-0 rounded-xl border-2 border-stone-200 bg-white px-3
                          text-[17px] outline-none transition focus:border-emerald-600
                          dark:border-stone-700 dark:bg-stone-950 dark:text-stone-100">
          </div>
          <datalist id="produkty-spizarnia">
            <template x-for="n in nazwyProduktow" :key="n"><option :value="n"></option></template>
          </datalist>
          <div class="px-4 pb-4 pt-2">
            <button type="button" @click="dodajDoSpizarni()" :disabled="!nowyProdukt.trim() || !nowaIlosc"
                    class="flex min-h-[2.7rem] w-full items-center justify-center gap-2 rounded-xl
                           bg-emerald-700 font-bold text-white transition active:scale-[0.98]
                           disabled:opacity-40 dark:bg-emerald-600">
              <svg class="ikona ikona-sm"><use href="#i-plus"/></svg> <span x-text="t('Dodaj do spiżarni')"></span>
            </button>
          </div>

          <p x-show="!Object.keys(spizarnia).length"

<script type="module">
/* Alpine importowany jako moduł i startowany ręcznie na końcu.

   tym modułem, wysyłał zdarzenie `alpine:init` w próżnię, a rejestracja danych
   przychodziła za późno — sidebar był pusty, nagłówek bez tytułu, lista się
   nie renderowała. Ta sama klasa błędu co przy wczytajSkale(): kolejność
   wykonania, nie składnia, więc sprawdzanie składni tego nie łapie. */
import Alpine from "./lib/alpine-esm.js";
import { polaczZBaza, kodStolu, pokazBrakStolu } from "./baza.js";
import collapse from "./lib/alpine-collapse-esm.js";
import { stanPoczatkowy } from "./postep.js";
import { POMOC } from "./pomoc.js";
import { danePowloki, ding , zarejestrujPrzeciaganie , zarejestrujPasek } from "./powloka.js";
import { policzZakupy, pogrupujDzialami, opisIlosci, kopiaNadajeSie,
         normalizujDopisek, dzialDopisku, normalizujMiare, opisMiary } from "./zakupy.js";
import { nalozSpizarnie, opisZapasu, kluczProduktu } from "./spizarnia.js";
import { TALIA_STARTOWA } from "./talia-startowa.js";
import { PRODUKTY } from "./produkty.js";
/* Numer wydania w komunikacie o awarii. 29 sierpnia dwa razy diagnozowaliśmy
   nie tę wersję, którą trzymał telefon: zrzut ekranu z błędem przychodził
   minutę po commicie, czyli zanim Netlify zdążył zbudować. Bez numeru nie da się
   tego odróżnić od „poprawka nie działa”, a to są dwie zupełnie różne sytuacje. */
import { WYDANIE } from "./wersja.js";

/* Firebase ładowany dynamicznie, nie importem na górze modułu.

   Powód jest konkretny: service worker cache'uje tylko własną domenę, więc SDK
   z gstatic.com nie jest dostępny offline. Przy imporcie statycznym nieudane
   pobranie zabija CAŁY moduł — łącznie z odczytem listy z pamięci telefonu,
   który siedzi w init(). W hali sklepu bez zasięgu dawało to nie „starą listę”,
   tylko pusty ekran pod x-cloak. Czyli dokładną odwrotność tego, po co ta apka
   w ogóle powstała. */

/* Bez stołu nie ma czego pokazać, ale natychmiastowe przekierowanie daje
   brzydkie mignięcie i nie mówi, co się stało. Częsty przypadek: ktoś dostał
   link do konkretnego ekranu albo wszedł z innej domeny (pamięć przeglądarki
   jest osobna dla każdego adresu), więc ma stół zapisany gdzie indziej. */
const kodDomu = localStorage.getItem("forkast-dom");
if (!kodDomu) {
  document.body.innerHTML = `
    <div class="flex h-dvh flex-col items-center justify-center gap-5 px-8 text-center">
      <p class="text-[0.68rem] font-extrabold uppercase tracking-[0.24em] text-emerald-700
                dark:text-emerald-400">Forkast</p>
      <h1 class="text-2xl font-bold">Najpierw usiądź do stołu</h1>
      <p class="max-w-[34ch] text-stone-500 dark:text-stone-400">
        Ta przeglądarka nie wie jeszcze, do którego stołu należysz. Załóż nowy
        albo wpisz kod, który ktoś Ci wysłał.
      </p>
      <a href="index.html"
         class="flex min-h-[2.9rem] w-full max-w-xs items-center justify-center rounded-xl
                bg-emerald-700 px-5 font-bold text-white no-underline dark:bg-emerald-600">
        Przejdź do stołu
      </a>
    </div>`;
  throw new Error("brak stołu");   // zatrzymuje resztę modułu
}

/* Ostatnia policzona lista leży też lokalnie. Powód jest zapisany w kosztach
   decyzji 4: przepisy przychodzą z bazy, więc bez sieci nie ma z czego policzyć
   zakupów — a brak zasięgu zdarza się akurat w sklepie, w hali z betonu. */
/* Klucze zawierają datę startu okresu.

   Bez tego odhaczenia przenosiły się na następny tydzień: układasz nowy plan,
   a połowa listy jest już odhaczona, bo te produkty kupiłeś siedem dni temu.
   Człowiek nie kupuje jajek. Żaden test tego nie łapał, bo problem mieszka
   w stanie przeglądarki, nie w czystej funkcji. */
const PREFIKS_LISTY = `forkast-zakupy-${kodDomu}-`;
const PREFIKS_ODHACZEN = `forkast-odhaczone-${kodDomu}-`;

/* Nazwa produktu jako klucz w bazie. Firebase nie przyjmuje w kluczach znaków
   . # $ [ ] / — a mamy „Mleko 2%”, „Śmietana 18%” i podobne. Slug jest stabilny:
   ta sama nazwa zawsze daje ten sam klucz, na każdym urządzeniu. */
const klucz = nazwa => nazwa.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/** Zostawia w pamięci tylko bieżący okres — inaczej localStorage rośnie w nieskończoność. */
function sprzatnij(prefiks, zostaw) {
  for (const k of Object.keys(localStorage))
    if (k.startsWith(prefiks) && k !== zostaw) localStorage.removeItem(k);
}

Alpine.plugin(collapse);
zarejestrujPrzeciaganie(Alpine);
zarejestrujPasek(Alpine);

Alpine.data("ekranZakupy", () => ({
  POMOC,
  pomocKlucz: null,

  ...danePowloki({
    ekran: "zakupy",
    tytul: "Lista zakupów",
    opis: "Policzona z jadłospisu. Działa też bez zasięgu.",
  }),

  laduje: true,
  pozycje: [],
  pominiete: [],
  stanSieci: "",
  odhaczone: new Set(),
  /* Rzeczy dopisane ręcznie: { klucz: { tekst } }. NIE są przypięte do okresu —
     pasta do zębów nie kończy się dlatego, że skończył się tydzień planowania
     (rozstrzygnięcie Miłosza, 29 sierpnia). Znikają dopiero odhaczone. */
  dopisane: {},
  odsubDopisanych: null,
  nowyDopisek: "",
  nowaMiara: "",
  /* Słownik produktów na komponencie, bo rozpoznawanie działu dla dopisanej
     pozycji dzieje się przy każdym przerysowaniu listy. Bez tego przypisania
     `dzialDopisku` dostawał `undefined`, wpadał w wartość domyślną (pustą listę)
     i KAŻDA dopisana rzecz lądowała w „Dopisanych” — także chleb. Nic by nie
     krzyknęło: pusty słownik to poprawne wejście, tylko odpowiedź zawsze ta sama. */
  slownik: [],
  kluczOdhaczen: null,
  kluczListy: null,

  get wgDzialu() {
    const grupy = new Map();
    for (const p of this.pozycje) {
      if (!grupy.has(p.dzial)) grupy.set(p.dzial, []);
      grupy.get(p.dzial).push(p);
    }
    /* Odhaczone spadają na dół działu: to, co zostało do kupienia, ma być
       na wierzchu, bo po to się w tę listę patrzy, stojąc w sklepie. */
    return [...grupy].map(([dzial, poz]) => ({
      dzial,
      pozycje: [...poz.filter(p => !p.wKoszyku), ...poz.filter(p => p.wKoszyku)],
    }));
  },
  /* Ile w tym dziale zostało do wzięcia. Nagłówek dzialu używał tej nazwy
     dwa razy i też jej nigdzie nie było — dział nigdy nie mówił „gotowe”. */
  zostaloWDziale(grupa) {
    return grupa.pozycje.filter(p => !p.wDomu && !p.wKoszyku).length;
  },

  /* POZYCJE, KTÓRE TRZEBA KUPIĆ — czyli te, których spiżarnia nie pokrywa
     w całości. Do 8 sierpnia ta nazwa była użyta pięć razy w nagłówku tego
     ekranu (duży licznik, „/ N”, „N już macie w domu”) i NIE ISTNIAŁA nigdzie
     w danych — więc licznik wywalał się przy każdym otwarciu Zakupów (decyzja 70). */
  get doKupienia() {
    return this.pozycje.filter(p => !p.wDomu);
  },

  get postep() {
    /* Mianownikiem są pozycje DO KUPIENIA. Produkt pokryty w całości przez
       spiżarnię nie liczy się do postępu (decyzja 37) — inaczej pasek nigdy
       nie doszedłby do stu procent, mimo że w sklepie nie ma już nic do wzięcia. */
    return this.doKupienia.length
      ? Math.round(this.doKupienia.filter(p => p.wKoszyku).length / this.doKupienia.length * 100) : 0;
  },
  get opisKoszyka() {
    const z = this.doKupienia.filter(p => p.wKoszyku).length;
    if (!this.pozycje.length) return "—";
    if (this.doKupienia.length && z === this.doKupienia.length) {
      const ile = Number(localStorage.getItem("forkast-kompletow") || 0);
      return ile >= 10 ? "Wszystko w koszyku. yeah yeah 🎵" : "Wszystko w koszyku. Możesz iść do domu.";
    }
    return `${z} z ${this.doKupienia.length} w koszyku`;
  },

  /* Wczytuje odhaczenia dla konkretnego okresu i sprząta poprzednie. */
  ustawOkres(startOkresu) {
    this.startOkresu = startOkresu;
    this.kluczOdhaczen = PREFIKS_ODHACZEN + startOkresu;
    this.kluczListy = PREFIKS_LISTY + startOkresu;
    sprzatnij(PREFIKS_ODHACZEN, this.kluczOdhaczen);
    sprzatnij(PREFIKS_LISTY, this.kluczListy);

    /* Kopia lokalna od razu, żeby lista miała stan przed odpowiedzią z sieci
       i żeby działała w sklepie bez zasięgu. */
    this.odhaczone = new Set(JSON.parse(localStorage.getItem(this.kluczOdhaczen) || "[]"));

    /* Odhaczenia leżą w bazie, nie tylko na telefonie.

       Do 3 sierpnia były wyłącznie lokalne — czyli każde urządzenie miało własne.
       Jadłospis synchronizował się na żywo, lista się przeliczała, ale to, co ktoś
       odhaczył w sklepie, nie docierało do drugiej osoby. Dokładnie odwrotnie niż
       obiecuje ta apka: dwie osoby przy jednym stole widzą jedną listę. */
    this.podepnijNasluchy(startOkresu);
  },

  /* PODPINANIE NASŁUCHÓW ODDZIELONE OD USTAWIANIA OKRESU — i to nie jest
     porządkowanie kodu, tylko naprawa.

     `ustawOkres` wołane jest DWA razy: raz od razu na starcie, na podstawie listy
     zapisanej w telefonie, i drugi raz, gdy przyjdzie jadłospis z bazy. Pierwsze
     wywołanie leci ZANIM istnieje połączenie, więc kończyło się na `if (!this.fb)
     return` — bez żadnego nasłuchu. Drugie wywołanie miało warunek „rób tylko, gdy
     okres się zmienił”, a okres się nie zmieniał, bo pierwsze wywołanie już go ustawiło.

     Skutek: telefon, który miał zapisaną listę — czyli każdy, który już raz tu był —
     NIE SŁUCHAŁ ANI SPIŻARNI, ANI ODHACZEŃ. Zmiany drugiej osoby nie docierały nigdy.
     Zgłoszone przez Miłosza jako „spiżarnia działa u jednego, u drugiego nic”;
     dotyczyło tak samo odhaczeń, czyli obietnicy z decyzji 35 (decyzja 74).

     Dlatego ta funkcja jest osobna, wolno ją wołać wielokrotnie i wołamy ją
     ZAWSZE po ustaleniu połączenia. */
  /* Dopisane ręcznie pozycje — nasłuch OSOBNY, nie w `podepnijNasluchy`.

     Tamta funkcja wychodzi na wejściu, gdy nie ma okresu planowania (`if (!this.fb
     || !startOkresu) return`) — a okresu nie ma dokładnie ten, kto nie układa
     jadłospisu i chce od apki wyłącznie listy zakupów. Czyli nasłuch nie powstawał
     u jedynej osoby, dla której ta funkcja w ogóle istnieje. Ta sama pułapka co
     8 sierpnia: nasłuch założony „przy okazji” innego potrafi nigdy nie powstać. */
  /* POŁĄCZENIE PRZYJMUJEMY W ARGUMENCIE, NIE Z `this.fb`.

     To jest cała przyczyna serii „i.insert is not a function” z 29 sierpnia.
     `this` w Alpine jest opakowane warstwą reaktywną, więc `this.fb.db` to nie
     jest obiekt bazy, tylko jego opakowanie — a Firebase sięga w środku do pól,
     których przez to opakowanie nie widzi. Wyjątek leci wtedy z głębi biblioteki
     i mówi o `insert`, czyli o czymś, co z naszym kodem nie ma nic wspólnego.

     Kod, który w tym pliku działa od tygodnia, bierze `db` z LOKALNEJ zmiennej
     `fb`, prosto z `polaczZBaza()`. Robimy tak samo. */
  podepnijDopisane(fb) {
    if (!fb || this.odsubDopisanych) return;

    /* WŁASNY TRY/CATCH, ODDZIELNY OD STARTU EKRANU.

       29 sierpnia ta jedna funkcja wywracała CAŁE Zakupy: wyjątek leciał w środku
       `initEkranu()`, więc razem z dopisywaniem znikała lista, spiżarnia i wszystko
       poniżej. Dodatek do ekranu nie ma prawa zabrać ze sobą ekranu — jeśli padnie,
       ma paść sam i powiedzieć, na którym kroku.

       `etap` jest tu po to, żeby zrzut ekranu z telefonu rozróżniał trzy rzeczy,
       które dotąd dawały jeden i ten sam komunikat: budowanie ścieżki, zakładanie
       nasłuchu i wykonanie się jego treści przy pierwszych danych. */
    let etap = "wypakowanie funkcji bazy";
    try {
      const { db, ref, onValue } = fb;

      etap = "budowanie ścieżki";
      const sciezka = ref(db, `domy/${kodDomu}/dopisane`);

      etap = "zakładanie nasłuchu";
      this.odsubDopisanych = onValue(sciezka, snap => {
        try {
          this.dopisane = snap.val() || {};
          /* BEZ TEJ LINIJKI NIE DZIEJE SIĘ NIC WIDOCZNEGO. `pozycje` nie jest
             getterem, tylko polem przeliczanym ręcznie — sama zmiana `dopisane`
             nie przerysuje listy. */
          this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
        } catch (e) {
          console.error("Dopisane — treść nasłuchu padła:", e);
          this.stanSieci = `[${WYDANIE}] Dopisane, treść nasłuchu: ${e?.message || e}`;
        }
      }, blad => this.nasluchPadl("dopisanych pozycji", blad));
    } catch (e) {
      console.error(`Dopisane — padło na kroku „${etap}”:`, e);
      this.stanSieci = `[${WYDANIE}] Dopisane padły na kroku „${etap}”: ${e?.message || e}`;
      this.mrugnij?.(`[${WYDANIE}] Dopisane padły na kroku „${etap}”: ${e?.message || e}`);
    }
  },

  podepnijNasluchy(startOkresu) {
    if (!this.fb || !startOkresu) return;
    const { db, ref, onValue } = this.fb;

    /* Spiżarnia jest wspólna dla stołu i nie zależy od okresu — zapas leży w domu
       niezależnie od tego, jaki tydzień planujecie. */
    if (!this.odsubSpizarni) {
      this.odsubSpizarni = onValue(ref(db, `domy/${kodDomu}/spizarnia`), snap => {
        this.spizarnia = snap.val() || {};
        this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
      }, blad => this.nasluchPadl("spiżarni", blad));
    }

    /* Odhaczenia leżą w bazie, nie tylko na telefonie.

       Do 3 sierpnia były wyłącznie lokalne — czyli każde urządzenie miało własne.
       Jadłospis synchronizował się na żywo, lista się przeliczała, ale to, co ktoś
       odhaczył w sklepie, nie docierało do drugiej osoby. Dokładnie odwrotnie niż
       obiecuje ta apka: dwie osoby przy jednym stole widzą jedną listę. */
    if (this.odsubOdhaczen) { this.odsubOdhaczen(); this.odsubOdhaczen = null; }
    this.odsubOdhaczen = onValue(
      ref(db, `domy/${kodDomu}/odhaczone/${startOkresu}`),
      snap => {
        const zBazy = new Set(Object.keys(snap.val() || {}));
        this.odhaczone = zBazy;
        localStorage.setItem(this.kluczOdhaczen, JSON.stringify([...zBazy]));
        this.pozycje = this.pozycje.map(x => ({ ...x, wKoszyku: zBazy.has(klucz(x.produkt)) }));
      }, blad => this.nasluchPadl("odhaczeń", blad));
  },

  /* NASŁUCH, KTÓRY PADŁ, MUSI BYĆ WIDOCZNY.

     `onValue` bez trzeciego argumentu nie zgłasza niczego na ekranie: gdy baza
     odmówi odczytu, po prostu nie przychodzą dane. Pusta spiżarnia bez prawa
     dostępu wygląda identycznie jak spiżarnia, do której nikt nic nie wpisał —
     i przez to wyglądało to na „nie synchronizuje się” zamiast na „baza mówi nie”
     (decyzja 76). */
  nasluchPadl(co, blad) {
    console.error(`Nasłuch ${co} padł:`, blad);
    const powod = blad?.code || blad?.message || String(blad);
    this.stanSieci = /permission/i.test(powod)
      ? `Baza nie pozwala czytać ${co} — to reguły dostępu, nie internet.`
      : `Nie dochodzą zmiany ${co}: ${powod}`;
  },

  async init() {
    try { await this.initEkranu(); }
    catch (e) {
      /* ZŁAPANY BŁĄD STARTU — ekran ma zostać użyteczny nawet wtedy, gdy
         odczyt z bazy albo cokolwiek innego padnie. Bez tego wyjątek przerywał
         init(), a wraz z nim znikało wszystko, co miało się wydarzyć niżej. */
      console.error("Błąd startu ekranu:", e);
      this.laduje = false;
      this.komunikat = this.t("Coś nie zadziałało przy wczytywaniu.");
      /* KOMUNIKAT MÓWI, CO SIĘ STAŁO — nie tylko, ŻE się stało.

         „Coś nie zadziałało. Spróbuj odświeżyć.” to zdanie, z którym nie da się
         nic zrobić: ani człowiekowi, który to widzi, ani mnie, gdy dostaję zrzut
         ekranu. Miłosz zgłosił ten komunikat 8 sierpnia i poszła na to cała runda
         zgadywania, bo treść wyjątku siedziała w konsoli telefonu, czyli nigdzie
         (decyzja 76). Konsoli na iPhonie się nie otwiera.

         Dlatego powód wchodzi do widocznej linii pod listą — tej samej, która mówi
         o braku zasięgu. Zostaje na ekranie, więc da się go sfotografować. */
      const powod = (e && (e.message || e.name)) || String(e);
      this.stanSieci = `[${WYDANIE}] Coś nie zadziałało przy wczytywaniu: ${powod}`;
      /* DYMEK MUSI WIEDZIEĆ TYLE, CO EKRAN. Powód siedział dotąd wyłącznie
         w linijce pod listą, a dymek mówił „Coś nie zadziałało. Spróbuj odświeżyć.” —
         czyli dokładnie to zdanie, o którym sami zapisaliśmy 8 sierpnia, że nie da
         się z nim nic zrobić. 29 sierpnia kosztowało to kolejną rundę: zrzut ekranu
         pokazywał dymek, a nie linijkę na dole, więc treść wyjątku znów nie dotarła.

         Numer wydania obok powodu, bo dwa razy tego samego dnia diagnozowaliśmy
         nie tę wersję, którą trzymał telefon. */
      this.mrugnij?.(`[${WYDANIE}] ${powod}`);
    }
  },

  async initEkranu() {
    if (!kodDomu) { pokazBrakStolu(); return; }
    this.initPowloka();

    /* Najpierw kopia lokalna, zanim cokolwiek dotknie sieci. Nie znamy jeszcze
       okresu, więc bierzemy jedyną zapisaną listę — po odpowiedzi z bazy i tak
       zostanie zastąpiona właściwą. */
    const kluczeList = Object.keys(localStorage).filter(k => k.startsWith(PREFIKS_LISTY));
    let lokalna = kluczeList.length ? localStorage.getItem(kluczeList[0]) : null;
    if (lokalna) {
      try {
        const d = JSON.parse(lokalna);
        /* KOPIA W TELEFONIE BYWA STARSZA NIŻ KOD. Zapisana przed v45 nie ma pola
           `gramy`, a spiżarnia od niego odejmuje — i celowo rzuca wyjątkiem, gdy
           liczby nie ma (decyzja 70). Taka kopia wywracała cały ekran: człowiek
           widział „Coś nie zadziałało”, odświeżenie nie pomagało, bo kopia
           zostawała, a ekran nie zdążył podpiąć się do bazy po nową. Kasujemy ją
           i idziemy dalej tak, jakby jej nie było (decyzja 75). */
        if (!kopiaNadajeSie(d.pozycje)) {
          localStorage.removeItem(kluczeList[0]);
          lokalna = null;
        } else {
          this.ustawOkres(d.okres);
          this.pozycje = this.zOdhaczeniami(d.pozycje);
          this.pominiete = d.pominiete || [];
          this.laduje = false;
          this.stanSieci = this.t("Pokazuję ostatnią zapisaną listę — sprawdzam, czy jest nowsza…");
        }
      } catch {
        /* Uszkodzona kopia nic nie psuje — ale musi też zniknąć, inaczej ten sam
           wyjątek wita człowieka przy każdym wejściu aż do skasowania danych. */
        localStorage.removeItem(kluczeList[0]);
        lokalna = null;
      }
    }

    const fb = await polaczZBaza();
    if (!fb) {
      this.laduje = false;
      this.stanSieci = lokalna
        ? "Brak połączenia — to ostatnia lista zapisana na tym telefonie."
        : "Brak połączenia i nie mam zapisanej listy. Wejdź tu raz z internetem.";
      return;
    }
    this.fb = fb;
    this.podepnijDopisane(fb);
    /* Połączenie dopiero teraz istnieje, a `ustawOkres` mogło już przelecieć
       wcześniej na zapisanej liście i nic nie podpiąć. Podpinamy tutaj (decyzja 74).

       W osobnym `try`, bo to jedyny kawałek startu, który stoi POZA dużym blokiem
       niżej — i gdyby cokolwiek tu rzuciło, przewróciłoby cały ekran zamiast zepsuć
       samą synchronizację. Lista zakupów ma się pokazać nawet wtedy, gdy nasłuch
       nie wstanie: w sklepie potrzebna jest lista, nie świeżość (decyzja 76). */
    try {
      this.podepnijNasluchy(this.startOkresu);
    } catch (e) {
      console.error("Nie udało się podpiąć nasłuchów:", e);
      this.stanSieci = `Lista działa, ale zmiany drugiej osoby mogą nie dochodzić: ${e?.message || e}`;
    }
    const { db, ref, get, onValue } = fb;

    try {
      const [snapWlasne, snapProdukty, snapPref, snapRest, snapWykl, snapUst] = await Promise.all([
        get(ref(db, `domy/${kodDomu}/wlasneDania`)),
        get(ref(db, `domy/${kodDomu}/produktyWlasne`)),
        get(ref(db, `domy/${kodDomu}/preferencje`)),
        get(ref(db, `domy/${kodDomu}/restauracyjne`)),
        get(ref(db, `domy/${kodDomu}/wykluczenia`)),
        get(ref(db, `domy/${kodDomu}/ustawienia`)),
      ]);
      /* Zakupy jako jedyny ekran nie czytały ustawień stołu — teraz muszą,
         bo język jest jednym z nich (decyzja 119). */
      this.przyjmijJezykZeStolu(snapUst.val());
      /* Wersje restauracyjne (113, 114): pierwszy odczyt razem z resztą, potem nasłuch —
         wersja wygenerowana na drugim telefonie przelicza listę bez odświeżania.
         Nasłuch woła to samo przeliczenie, co nasłuch jadłospisu, na ostatnim
         znanym planie; przed pierwszym planem nie ma czego liczyć. */
      let restauracyjne = snapRest.val() || {};
      let ostatniPlan = null;
      this.ustawOdblokowanie(stanPoczatkowy(snapPref.val() || {}, snapWykl.val() || []));
      const wlasne = Object.entries(snapWlasne.val() || {}).map(([id, d]) => ({ id, ...d }));
      const wszystkie = [...TALIA_STARTOWA, ...wlasne];
      const slownik = [...PRODUKTY, ...Object.values(snapProdukty.val() || {})];

      /* MUSI stać PO deklaracji slownika. Stało przed i rzucało wyjątek
         „Cannot access ’slownik’ before initialization” — a że cały blok jest
         w try, wyjątek lądował w catch, który mówił „brak połączenia” i zostawiał
         PUSTĄ LISTĘ ZAKUPÓW. Objaw nie miał nic wspólnego z przyczyną.

         Trzeci raz dziś ta sama pułapka: const nie jest wynoszony na górę,
         więc kolejność linii jest częścią działania, nie tylko czytelności. */
      this.wszystkieNazwy = slownik.map(x => x.n);
      this.slownik = slownik;

      /* onValue zamiast get: dwie osoby przy jednym stole widzą swoje zmiany
         bez odświeżania. */
      const naPlan = (zapisany) => {
        ostatniPlan = zapisany;
        if (!zapisany?.siatka?.length) {
          /* Brak jadłospisu NIE znaczy pusta lista. Dopisane ręcznie pozycje żyją
             niezależnie od planu — i to one są całą listą u kogoś, kto planu nie
             układa. Zerowanie `pozycje` na sztywno kasowało je z widoku przy każdej
             odpowiedzi z bazy o jadłospisie, czyli natychmiast po dopisaniu. */
          this.pozycjeSurowe = [];
          this.pozycje = this.pozycjeDopisane;
          this.pominiete = []; this.laduje = false; this.stanSieci = "";
          return;
        }
        // Okres znany dopiero tutaj — dopiero teraz wiadomo, które odhaczenia wczytać.
        const start = zapisany.okres?.start || "brak";
        if (this.kluczOdhaczen !== PREFIKS_ODHACZEN + start) this.ustawOkres(start);

        const wynik = policzZakupy(zapisany.siatka, wszystkie, restauracyjne);
        const grupy = pogrupujDzialami(wynik.pozycje, slownik);
        const plaskie = grupy.flatMap(g => g.pozycje.map(p => ({
          produkt: p.produkt,
          dzial: g.dzial,
          /* `gramy` MUSI tu przejść. Do 8 sierpnia spłaszczanie zostawiało tylko
             gotowy napis „400 g”, więc nalozSpizarnie() dostawało pozycje bez liczby
             i liczyło `masz - undefined` = NaN. Spiżarnia nie odejmowała nic,
             a znacznik „mamy” nie zapalał się nigdy (decyzja 70). */
          gramy: p.gramy,
          ile: opisIlosci(p.gramy),
          zDan: p.wDaniach.join(" · "),
        })));
        this.pozycje = this.zOdhaczeniami(plaskie);
        this.pominiete = wynik.pominiete;
        this.laduje = false;
        this.stanSieci = "";
        localStorage.setItem(this.kluczListy, JSON.stringify({
          okres: start, pozycje: plaskie, pominiete: wynik.pominiete, kiedy: Date.now(),
        }));
      };
      onValue(ref(db, `domy/${kodDomu}/jadlospis`), (snap) => naPlan(snap.val()),
              blad => this.nasluchPadl("jadłospisu", blad));
      onValue(ref(db, `domy/${kodDomu}/restauracyjne`), (snap) => {
        restauracyjne = snap.val() || {};
        if (ostatniPlan) naPlan(ostatniPlan);
      }, blad => this.nasluchPadl("wersji restauracyjnych", blad));
    } catch {
      this.laduje = false;
      this.stanSieci = lokalna
        ? "Brak połączenia — to ostatnia lista zapisana na tym telefonie."
        : "Brak połączenia i nie mam zapisanej listy. Wejdź tu raz z internetem.";
    }
  },

  pozycjeSurowe: [],

  /* STAN SPIŻARNI — pola, których do 8 sierpnia po prostu nie było.
     Metody niżej pisały do nich (`this.spizarnia[klucz] = ...`), ale szablon
     czytał je, zanim cokolwiek je stworzyło: `Object.keys(spizarnia)` i
     `!nowyProdukt.trim()` wywalały się na undefined przy pierwszym rysowaniu
     (decyzja 70). `arkuszSpizarni` zniknęło razem z wysuwanym okienkiem —
     spiżarnia jest teraz stałą sekcją listy, nie okienkiem (decyzja 74). */
  spizarnia: {},
  nowyProdukt: "",
  nowaIlosc: null,

  get nazwyProduktow() {
    return [...new Set([...this.pozycjeSurowe.map(p => p.produkt), ...this.wszystkieNazwy])]
      .sort((a, b) => a.localeCompare(b, "pl"));
  },
  wszystkieNazwy: [],

  get zawartoscSpizarni() {
    /* Zużycie w tym okresie bierzemy z listy, żeby móc powiedzieć „starczy na 3 okresy”.
       Produkt, którego w tym okresie nie ma, dostaje uczciwe „nie ma tego w tym okresie”
       zamiast zmyślonej liczby. */
    const zuzycie = Object.fromEntries(
      this.pozycjeSurowe.map(p => [kluczProduktu(p.produkt), p.gramy]));
    const nazwy = Object.fromEntries(
      [...this.pozycjeSurowe.map(p => p.produkt), ...this.wszystkieNazwy]
        .map(n => [kluczProduktu(n), n]));
    return Object.entries(this.spizarnia)
      .filter(([, g]) => g > 0)
      .map(([klucz, gramy]) => ({
        klucz, gramy,
        nazwa: nazwy[klucz] || klucz,
        opis: opisZapasu(gramy, zuzycie[klucz] || 0),
      }))
      .sort((a, b) => a.nazwa.localeCompare(b.nazwa, "pl"));
  },

  /* ZAPISUJEMY CAŁĄ GAŁĄŹ, NIE POJEDYNCZE DZIECKO — dokładnie jak spiżarnia.

     Pierwsza wersja robiła `set(push(ref(…dopisane)), {…})`, czyli obiekt pod
     NOWYM kluczem. Wyglądało to na kształt dozwolony przez pułapkę 2 („obiekt
     pod gałęzią działa”) i nie jest: na gałęzi `dopisane` wisi nasłuch, więc
     zapis skończył się tym samym wyjątkiem ze środka Firebase, co 8 sierpnia —
     „i.insert is not a function”. Pułapka była przeczytana i zacytowana w tym
     samym pliku, a mimo to ominięta; `push()` po prostu nie mieści się w tym,
     co wtedy sprawdziliśmy.

     Klucz robimy sami, bo `push()` był potrzebny wyłącznie po to, żeby zapisać
     dziecko osobno. Znacznik czasu z przyrostkiem wystarcza i nie zawiera znaków
     zakazanych w kluczach Firebase (`. # $ [ ] /`).

     Koszt, świadomy i ten sam co przy spiżarni: dwie osoby dopisujące coś w tej
     samej sekundzie nadpiszą sobie nawzajem. Przy liście zakupów to zdarzenie
     teoretyczne, a alternatywą jest zapis, który nie dochodzi wcale. */
  kluczDopisku() {
    return `d${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  },

  async dopisz() {
    const tekst = normalizujDopisek(this.nowyDopisek);
    if (!tekst) return;
    if (!this.fb) { this.mrugnij?.("Brak połączenia — dopiszę, gdy wróci internet."); return; }
    const ile = normalizujMiare(this.nowaMiara);
    this.nowyDopisek = "";
    this.nowaMiara = "";

    const poprzednie = this.dopisane;
    /* Pola `ile` nie wpisujemy, gdy go nie ma. Firebase i tak nie zapisuje wartości
       pustych, a jawny `null` w obiekcie robi w bazie śmieć bez znaczenia. */
    const wpis = { tekst, kiedy: Date.now(), ...(ile ? { ile } : {}) };
    const zNowym = { ...this.dopisane, [this.kluczDopisku()]: wpis };
    this.dopisane = zNowym;
    this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);

    try {
      const { db, ref, set } = this.fb;
      await set(ref(db, `domy/${kodDomu}/dopisane`), zNowym);
      this.mrugnij?.(`Dopisano „${tekst}”`);
    } catch (e) {
      console.error("Nie udało się dopisać:", e);
      this.dopisane = poprzednie;
      this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
      this.nowyDopisek = tekst;
      this.nowaMiara = ile || "";
      this.mrugnij?.(`[${WYDANIE}] Nie udało się dopisać: ${e?.code || e?.message || e}`);
    }
  },

  async odhaczDopisek(p) {
    const wpis = this.dopisane[p.dopisek];
    if (!wpis) return;

    const poprzednie = this.dopisane;
    const zmienione = { ...this.dopisane,
                        [p.dopisek]: { ...wpis, odhaczone: !wpis.odhaczone } };
    this.dopisane = zmienione;
    this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
    navigator.vibrate?.(10);
    this.komunikat = `${p.produkt}: ${wpis.odhaczone ? "z powrotem na liście" : "w koszyku"}`;

    if (!this.fb) return;
    try {
      const { db, ref, set } = this.fb;
      await set(ref(db, `domy/${kodDomu}/dopisane`), zmienione);
    } catch (e) {
      console.error("Nie udało się odhaczyć dopisanej pozycji:", e);
      this.dopisane = poprzednie;
      this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
      this.mrugnij?.(`[${WYDANIE}] Nie udało się zapisać: ${e?.code || e?.message || e}`);
    }
  },

  async skreslDopisek(p) {
    /* Optymistycznie, jak przy odhaczaniu: człowiek przy kasie nie czeka na sieć.
       Gdy zapis padnie, pozycja wraca na listę i mówimy dlaczego. */
    const poprzednie = this.dopisane;
    const bez = { ...this.dopisane };
    delete bez[p.dopisek];
    this.dopisane = bez;
    this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
    try {
      const { db, ref, set } = this.fb;
      /* Pusty obiekt kasuje gałąź (pułapka 15) — i dokładnie o to chodzi,
         gdy skreślono ostatnią dopisaną rzecz. */
      await set(ref(db, `domy/${kodDomu}/dopisane`), bez);
      this.mrugnij?.(`Skreślono „${p.produkt}”`);
    } catch (e) {
      console.error("Nie udało się skreślić:", e);
      this.dopisane = poprzednie;
      this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);
      this.mrugnij?.(`[${WYDANIE}] Nie udało się skreślić: ${e?.code || e?.message || e}`);
    }
  },

  async dodajDoSpizarni() {
    const nazwa = this.nowyProdukt.trim();
    const gramy = Math.round(Number(this.nowaIlosc) || 0);
    if (!nazwa || gramy <= 0) return;
    await this.ustawWSpizarni(kluczProduktu(nazwa), gramy, nazwa);
    this.nowyProdukt = ""; this.nowaIlosc = null;
  },

  async ustawWSpizarni(klucz, wartosc, nazwaDoZapamietania = null) {
    const gramy = Math.max(0, Math.round(Number(wartosc) || 0));
    // Optymistycznie, tak jak przy odhaczaniu — apka ma reagować od razu.
    if (gramy > 0) this.spizarnia[klucz] = gramy; else delete this.spizarnia[klucz];
    if (nazwaDoZapamietania && !this.wszystkieNazwy.includes(nazwaDoZapamietania))
      this.wszystkieNazwy.push(nazwaDoZapamietania);
    this.pozycje = this.zOdhaczeniami(this.pozycjeSurowe);

    if (!this.fb) return;
    try {
      const { db, ref, set } = this.fb;
      /* ZAPISUJEMY CAŁĄ GAŁĄŹ, NIE POJEDYNCZE DZIECKO.

         Kształt zapisu okazał się mieć znaczenie i widać to wprost w bazie.
         Istnieją tam: `jadlospis` (obiekt na całej gałęzi), `domownicy` (obiekt
         pod gałęzią), `preferencje` (wartość prosta, ale bez nasłuchu) i
         `wykluczenia`. NIE ISTNIEJĄ: `spizarnia` i `odhaczone` — jedyne dwa
         miejsca, gdzie zapisywaliśmy WARTOŚĆ PROSTĄ (liczbę, `true`) pod gałąź,
         na której wisi nasłuch. Każda taka próba kończyła się wyjątkiem ze środka
         Firebase: „i.insert is not a function”. `update` z jednym kluczem zachował
         się tak samo, bo w środku biblioteki to ta sama droga (decyzja 76).

         Dlatego piszemy tu tym kształtem, który w tej apce działa od tygodnia:
         obiekt na całej gałęzi, dokładnie jak jadłospis.

         Koszt, świadomy: dwie osoby zmieniające spiżarnię w tej samej sekundzie
         nadpiszą sobie nawzajem ostatnią zmianę. Przy zapasach w domu to zdarzenie
         teoretyczne, a jedyna alternatywa to zapis, który nie dociera wcale. */
      const stan = { ...this.spizarnia };
      /* ZAWSZE OBIEKT, NIGDY `null`. Pusty obiekt Firebase i tak kasuje węzeł
         (pułapka 15), a `null` to wartość prosta — czyli dokładnie ten kształt,
         który pod nasłuchem nie dochodzi (pułapka 2). Jedno i drugie kasuje,
         tylko jedno działa. */
      await set(ref(db, `domy/${kodDomu}/spizarnia`), stan);
    } catch (e) {
      /* POWÓD, NIE DOMYSŁ. „Sprawdź internet” było zgadywaniem: baza odmawia
         zapisu także wtedy, gdy internet działa bez zarzutu, a nie zgadzają się
         reguły dostępu. Marzena widziała ten komunikat przy pełnym zasięgu —
         i przez to szukaliśmy problemu w zupełnie złym miejscu (decyzja 76). */
      console.error("Zapis do spiżarni nie przeszedł:", e);
      const powod = e?.code || e?.message || String(e);
      this.mrugnij(/permission|PERMISSION/i.test(powod)
        ? this.t("Baza nie pozwala zapisać spiżarni — to reguły dostępu, nie internet.")
        : this.t("Nie udało się zapisać: ") + powod);
    }
  },

  /* `odliczZuzycie()` i `odliczanieUzbrojone` zniknęły razem z przyciskiem
     „Ugotowane — odlicz zużycie okresu”: spiżarnię odejmuje teraz ptaszek przy
     posiłku w jadłospisie, po jednej porcji naraz (decyzja 77). Zostawienie
     martwej metody kusiłoby, żeby ją kiedyś z powrotem podpiąć — a wtedy
     odjęłoby się dwa razy. */

  /* Nakłada na listę dwie warstwy: co już macie w domu (spiżarnia) i co już
     wzięliście ze sklepu (odhaczenia). Trzymamy surową listę osobno, bo obie
     warstwy zmieniają się niezależnie i każda musi umieć przeliczyć od nowa. */
  zOdhaczeniami(lista) {
    /* JEDYNE WEJŚCIE DO LICZENIA — i dlatego sprawdzenie kształtu stoi właśnie tu.

       Odsianie starej kopii przy odczycie z pamięci telefonu nie wystarczało:
       ta funkcja przypisywała `pozycjeSurowe` PRZED policzeniem, więc stara lista
       zostawała w pamięci ekranu nawet wtedy, gdy liczenie się wywaliło. Potem
       pierwsza odpowiedź z bazy o spiżarni wołała to ponownie na tej samej starej
       liście — i wyjątek leciał już ze środka nasłuchu, przewracając cały start
       ekranu. Stąd „Coś nie zadziałało” przy każdym wejściu (decyzja 75).

       Teraz lista w złym kształcie nie ma jak wejść: zostaje pusta lista i czekamy
       na odpowiedź z bazy, która przychodzi w kształcie dzisiejszym. */
    const dobra = kopiaNadajeSie(lista) ? lista : [];
    if (lista?.length && !dobra.length) {
      console.warn("Lista w starym kształcie — pomijam ją i czekam na odpowiedź z bazy.");
    }
    this.pozycjeSurowe = dobra;
    return nalozSpizarnie(dobra, this.spizarnia)
      .map(p => ({
        ...p,
        /* Liczby zamieniane na napisy TU, a nie w widoku — żeby „250 g” i „1,2 kg”
           powstawały tą samą funkcją co reszta listy. */
        ileDoKupienia: opisIlosci(p.doKupienia),
        ileWDomu: opisIlosci(p.masz),
        wKoszyku: this.odhaczone.has(klucz(p.produkt)),
      }))
      .concat(this.pozycjeDopisane);
  },

  /* Dopisane ręcznie, przebrane w ten sam kształt co reszta listy — żeby wiersz,
     odhaczanie i grupowanie działami były JEDNYM mechanizmem, nie dwoma.

     Dział bierzemy ze słownika, gdy da się rozpoznać: chleb ma stanąć przy
     pieczywie, nie w worku „dopisane”, bo w sklepie chodzi się działami
     (zgłoszenie Miłosza, 29 sierpnia). Czego nie rozpoznamy — pasta do zębów,
     worki na śmieci — ląduje w „Dopisane”.

     `ileDoKupienia` jest pusty celowo: te pozycje nie mają gramatury i nie ma
     tu czego przeliczać ani odejmować od spiżarni. Liczbę, jeśli trzeba, człowiek
     wpisuje w treść: „2 pasty do zębów”. */
  get pozycjeDopisane() {
    return Object.entries(this.dopisane)
      .map(([id, w]) => ({ id, tekst: normalizujDopisek(w?.tekst), ile: normalizujMiare(w?.ile),
                           odhaczone: !!w?.odhaczone }))
      .filter(w => w.tekst)
      .sort((a, b) => a.tekst.localeCompare(b.tekst, "pl"))
      .map(w => ({
        produkt: w.tekst,
        dzial: dzialDopisku(w.tekst, this.slownik) || "Dopisane",
        zDan: "dopisane ręcznie",
        dopisek: w.id,
        gramy: 0, masz: 0, doKupienia: 0, wDomu: false,
        /* Wpisane wprost: „×3”, „500 g”, „2 opakowania”. Ta wartość NIE wchodzi
           do przeliczania porcji ani do odejmowania spiżarni — jedynym jej odbiorcą
           jest człowiek przed półką. Przy jednej sztuce nie pokazujemy nic. */
        ileDoKupienia: opisMiary(w.ile),
        ileWDomu: "",
        wKoszyku: w.odhaczone,
      }));
  },

    /* Optimistic UI: stan zmienia się natychmiast, zapis do pamięci telefonu
     idzie zaraz potem. Człowiek stojący przy kasie nie czeka na potwierdzenie. */
  /* Optimistic UI: stan zmienia się natychmiast, zapis do bazy idzie w tle.
     Człowiek stojący przy kasie nie czeka na potwierdzenie z sieci.

     Bez zasięgu zapis nie przechodzi — wtedy odhaczenie zostaje w pamięci telefonu
     i trafi do bazy przy najbliższym wejściu z internetem. To jedyny scenariusz,
     w którym dwie osoby mogą się chwilowo rozjechać, i jest akceptowalny:
     w sklepie bez zasięgu i tak jest się samemu. */
  /* Zmiana kolejności bez przeskoku.

     Mierzymy, gdzie wiersze są PRZED zmianą, pozwalamy Alpine przerysować listę,
     mierzymy PO — i cofamy każdy wiersz transformacją na stare miejsce, po czym ją
     zdejmujemy. Przeglądarka animuje wtedy tylko transform, czyli po stronie karty
     graficznej, więc lista nie migocze nawet przy trzydziestu pozycjach.

     Bez tego odhaczona pozycja znika i pojawia się niżej w tej samej klatce —
     wygląda jak usterka, a to najczęstszy gest w całej aplikacji. */
  async plynnaZmianaKolejnosci(zmien) {
    const wiersze = [...document.querySelectorAll("li.poz-zakupy")];
    const przed = new Map(wiersze.map(el => [el.dataset.produkt, el.getBoundingClientRect().top]));

    zmien();
    await this.$nextTick();

    for (const el of document.querySelectorAll("li.poz-zakupy")) {
      const staraGora = przed.get(el.dataset.produkt);
      if (staraGora === undefined) continue;
      const roznica = staraGora - el.getBoundingClientRect().top;
      if (Math.abs(roznica) < 2) continue;
      el.style.transition = "none";
      el.style.transform = `translateY(${roznica}px)`;
      el.classList.add("plynie");
      requestAnimationFrame(() => {
        el.style.transition = "";
        el.style.transform = "";
        setTimeout(() => el.classList.remove("plynie"), 450);
      });
    }
  },

  async odhacz(p) {
    /* Dopisana ręcznie pozycja zaznacza się na SOBIE, nie w gałęzi odhaczeń.
       Tamte są przypięte do okresu planowania, a ta z okresem nie ma nic wspólnego —
       pasta do zębów nie odznacza się dlatego, że zaczął się nowy tydzień. */
    if (p.dopisek) return this.odhaczDopisek(p);

    const k = klucz(p.produkt);

    // Ściśnięcie natychmiast — dotknięcie ma mieć odpowiedź, zanim ruszy kolejność.
    const wiersz = document.querySelector(`li.poz-zakupy[data-produkt="${CSS.escape(p.produkt)}"]`);
    wiersz?.classList.add("wlasnie-odhaczone");
    setTimeout(() => wiersz?.classList.remove("wlasnie-odhaczone"), 300);

    await this.plynnaZmianaKolejnosci(() => {
      p.wKoszyku = !p.wKoszyku;
      if (p.wKoszyku) this.odhaczone.add(k); else this.odhaczone.delete(k);
    });
    if (this.kluczOdhaczen)
      localStorage.setItem(this.kluczOdhaczen, JSON.stringify([...this.odhaczone]));
    navigator.vibrate?.(10);
    this.komunikat = `${p.produkt}: ${p.wKoszyku ? "w koszyku" : "z powrotem na liście"}`;

    if (this.postep === 100) {
      const ile = Number(localStorage.getItem("forkast-kompletow") || 0) + 1;
      localStorage.setItem("forkast-kompletow", String(ile));
      ding();
      this.mrugnij(ile >= 10 ? this.t("Wszystko w koszyku. yeah yeah 🎵")
                             : this.t("Wszystko w koszyku. Możesz iść do domu."));
    } else if (this.pozycje.filter(x => !x.wKoszyku).length === 1 && p.wKoszyku) {
      const ostatni = this.pozycje.find(x => !x.wKoszyku);
      if (ostatni) this.mrugnij(`Został tylko ${ostatni.produkt.toLowerCase()}. Dasz radę.`);
    }

    if (!this.fb || !this.startOkresu) return;
    try {
      /* Odhaczeń też nie było w bazie — ten sam kształt zapisu, ten sam błąd,
         tylko niewidoczny, bo komunikat mówił „zsynchronizuje się, gdy wróci
         internet”. Czyli obietnica z decyzji 35 — dwie osoby przy jednym stole
         widzą jedną listę — nie działała ani razu (decyzja 76).

         Wysyłamy komplet odhaczonych, nie pojedynczy klucz. `this.odhaczone` jest
         na bieżąco nadpisywane przez nasłuch, więc to nie jest widok sprzed minuty:
         to najświeższy stan, jaki ten telefon zna. */
      const { db, ref, set } = this.fb;
      const komplet = Object.fromEntries([...this.odhaczone].map(x => [x, true]));
      /* ZAWSZE OBIEKT, NIGDY `null`. Pusty obiekt Firebase i tak kasuje węzeł
         (pułapka 15), a `null` to wartość prosta — czyli dokładnie ten kształt,
         który pod nasłuchem nie dochodzi (pułapka 2). Jedno i drugie kasuje,
         tylko jedno działa. */
      await set(ref(db, `domy/${kodDomu}/odhaczone/${this.startOkresu}`), komplet);
    } catch {
      /* Nie cofamy stanu: człowiek widzi, że odhaczył, i tak ma być.
         Zapis dogoni bazę przy następnym wejściu z zasięgiem. */
      this.stanSieci = this.t("Odhaczone zapisane na tym telefonie — zsynchronizuje się, gdy wróci internet.");
    }
  },
}));

/* Sprite ikon wstrzykiwany raz. Czekamy na niego przed startem Alpine —
   inaczej pierwsze rysowanie trafia na <use> wskazujące w pustkę. */
window.Alpine = Alpine;
Alpine.start();

/* Sprite ikon i okienko pomocy dociągane PO starcie Alpine, nie przed.

   Wcześniej były przed — z `await` na górnym poziomie modułu. Skutek: jeśli
   którekolwiek pobranie zawisło (a service worker potrafi zawiesić żądanie
   przy zerwanej sieci), `Alpine.start()` nigdy się nie wykonywał, `x-cloak`
   nigdy nie schodził i człowiek dostawał BIAŁY EKRAN.

   Ikony pojawiające się o pół sekundy później to koszt, którego nikt nie
   zauważy. Biały ekran to koszt, po którym nikt nie wraca.

   Limit czasu, bo `fetch` bez niego potrafi czekać w nieskończoność. */
(async () => {
  const pobierz = (plik) => Promise.race([
    fetch(plik).then(r => r.text()),
    new Promise((_, odrzuc) => setTimeout(() => odrzuc(new Error("limit czasu")), 5000)),
  ]);
  for (const [id, plik] of [["ikony", "ikony.html"], ["pomoc", "pomoc.html"]]) {
    const cel = document.getElementById(id);
    if (!cel) continue;
    try { cel.innerHTML = await pobierz(plik); }
    catch (e) { console.warn(`Nie udało się wczytać ${plik}:`, e); }
  }
})();
</script>

<script>
/* BEZPIECZNIK BIAŁEGO EKRANU

   `x-cloak` ukrywa całą stronę, dopóki Alpine nie przejmie kontroli. Gdy Alpine
   wywali się przy starcie — bo padł import, bo sieć zerwała moduł, bo cokolwiek —
   atrybut nigdy nie znika i człowiek dostaje BIAŁY EKRAN bez żadnej informacji.
   Nie ma wtedy nawet przycisku, żeby wyjść.

   Po dwóch sekundach zdejmujemy zasłonę siłą i pokazujemy, co się stało, razem
   z dwiema drogami wyjścia. Lepszy nieostylowany ekran z komunikatem niż biel.

   Dwie sekundy: Alpine startuje w ~200 ms nawet na starym telefonie przy zimnym
   cache, więc jeśli po dwóch go nie ma, to go nie będzie. */
(function () {
  var start = Date.now();
  setTimeout(function () {
    if (!window.Alpine) {
      document.body.removeAttribute("x-cloak");
      var box = document.createElement("div");
      box.setAttribute("style",
        "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;" +
        "align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;" +
        "background:#fafaf9;color:#292524;font:16px/1.5 -apple-system,system-ui,sans-serif");
      box.innerHTML =
        '<p style="font-size:20px;font-weight:700;margin:0">Coś się zacięło przy starcie</p>' +
        '<p style="margin:0;max-width:32ch;color:#57534e">Aplikacja nie zdążyła się uruchomić. ' +
        'Najczęściej pomaga pobranie jej od nowa.</p>' +
        '<button id="fk-reset" style="min-height:52px;padding:0 24px;border:0;border-radius:12px;' +
        'background:#047857;color:#fff;font-weight:700;font-size:16px">Pobierz od nowa</button>' +
        '<a href="index.html" style="color:#047857;font-size:14px">Wróć na początek</a>' +
        '<p style="margin:0;font-size:12px;color:#a8a29e">czas: ' + (Date.now() - start) + ' ms</p>';
      document.body.appendChild(box);
      document.getElementById("fk-reset").onclick = function () {
        if (window.caches) caches.keys().then(function (k) { k.forEach(function (x) { caches.delete(x); }); });
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
          .then(function (r) { r.forEach(function (x) { x.unregister(); }); });
        setTimeout(function () { location.reload(true); }, 300);
      };
    }
  }, 2000);
})();
</script>

<script>
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
