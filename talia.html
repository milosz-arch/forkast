<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forkast">
<title>Dania — Forkast</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikona.svg">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<script src="lib/tailwind.js"></script>
<!-- Ta jedna deklaracja MUSI być tutaj, nie w styl.css.
     Przeglądarkowy Tailwind kompiluje wyłącznie bloki <style type="text/tailwindcss">
     w dokumencie — w zewnętrznym arkuszu jest ignorowana, a wtedy `dark:` działa
     po ustawieniu systemu i przełącznik w Ustawieniach nic nie zmienia. -->
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
<link rel="stylesheet" href="styl.css">
</head>

<body class="h-full bg-stone-50 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-100"
      x-data="ekranDania" x-init="init()" x-cloak>

<div id="ikony"></div>
<div id="pomoc"></div>
<p aria-live="polite" class="sr-only" x-text="komunikat"></p>

<div class="flex h-dvh flex-col overflow-hidden md:flex-row">

  <nav class="hidden shrink-0 flex-col gap-1.5 border-r border-stone-200/70 bg-white p-5
              md:flex md:w-60 lg:w-64 dark:border-stone-800 dark:bg-stone-900"
       aria-label="Nawigacja główna">
    <p class="mb-4 border-b border-stone-100 pb-5 text-lg font-black tracking-tight
              text-emerald-700 dark:border-stone-800 dark:text-emerald-400">Forkast</p>
    <template x-for="z in zakladki" :key="z.id">
      <a :href="zamknieta(z.id) ? 'talia.html' : z.plik"
         :aria-current="z.id === ekran ? 'page' : null"
         :aria-disabled="zamknieta(z.id) ? 'true' : null"
         class="flex h-12 items-center gap-3 rounded-xl px-3.5 no-underline transition"
         :class="zamknieta(z.id) ? 'text-stone-300 dark:text-stone-700'
                 : z.id === ekran
                 ? 'bg-emerald-50 font-bold text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-400'
                 : 'text-stone-500 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800'">
        <svg class="ikona"><use :href="'#i-' + z.id"/></svg>
        <span x-text="z.nazwa"></span>
        <span x-show="z.id === ekran" class="ml-auto size-1.5 rounded-full bg-emerald-600 dark:bg-emerald-400"></span>
      </a>
    </template>
    <a href="ustawienia.html"
       class="mt-1 flex h-12 items-center gap-3 rounded-xl px-3.5 text-stone-500 no-underline
              transition hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800">
      <svg class="ikona"><use href="#i-ustawienia"/></svg>
      <span>Ustawienia</span>
    </a>
  </nav>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col">

    <header class="relative shrink-0 overflow-hidden rounded-b-[1.75rem] bg-gradient-to-br
                   from-emerald-600 via-emerald-700 to-emerald-800 px-5 text-white
                   shadow-lg shadow-emerald-900/20 md:rounded-none"
            style="padding-top:calc(1.15rem + env(safe-area-inset-top,0px)); padding-bottom:1.4rem">
      <p class="text-[0.68rem] font-extrabold uppercase tracking-[0.24em] text-white/80">Forkast</p>
      <h1 class="mt-1.5 text-[1.75rem] font-bold leading-tight tracking-tight" x-text="tytul"></h1>
      <p class="mt-1 max-w-[36ch] text-[0.82rem] leading-snug text-white/85" x-text="opis"></p>
      <button type="button" x-show="ekranObslugiwany" @click="przelaczEkran()"
              :aria-pressed="ekranSwieci.toString()"
              :aria-label="ekranSwieci ? 'Ekran nie gaśnie. Dotknij, żeby wyłączyć.'
                                       : 'Ekran gaśnie. Dotknij, żeby świecił.'"
              class="absolute flex min-h-[2.5rem] items-center gap-1.5 rounded-full border px-3
                     text-[0.68rem] font-bold backdrop-blur-md transition"
              style="top:calc(0.9rem + env(safe-area-inset-top,0px)); right:7.4rem"
              :class="ekranSwieci ? 'border-white bg-white text-emerald-800'
                                  : 'border-white/40 bg-white/15 text-white/90'">
        <svg class="ikona ikona-sm"><use :href="ekranSwieci ? '#i-slonce' : '#i-ksiezyc'"/></svg>
        <span class="hidden min-[380px]:inline" x-text="ekranSwieci ? 'Świeci' : 'Gaśnie'"></span>
      </button>
      <button type="button" @click="pomocKlucz = 'dania'"
              aria-label="Jak to działa"
              class="absolute flex size-11 items-center justify-center rounded-full border
                     border-white/35 bg-white/15 text-[1rem] font-bold text-white
                     backdrop-blur-md transition active:scale-95"
              style="top:calc(0.9rem + env(safe-area-inset-top,0px)); right:4.2rem">i</button>

      <a href="ustawienia.html" aria-label="Ustawienia"
         class="absolute flex size-11 items-center justify-center rounded-full border
                border-white/35 bg-white/15 text-white no-underline backdrop-blur-md
                transition active:scale-95"
         style="top:calc(0.9rem + env(safe-area-inset-top,0px)); right:1rem">
        <svg class="ikona ikona-sm"><use href="#i-ustawienia"/></svg>
      </a>
    </header>

    <!-- Zapas na dole: przy talii przyciski decyzji stoją teraz w osobnym pasku
         POD tym obszarem, więc treść nie musi się spod nich chować — wystarczy
         odstęp na oddech. Na pozostałych krokach ekranu zapas zostaje większy,
         bo tam pod spodem jest tylko dolna nawigacja. -->
    <main class="plynne bez-paska min-h-0 flex-1 overflow-y-auto scroll-smooth px-4 pt-5 md:px-8"
          :style="krok === 'talia' && !laduje && danie
                  ? 'padding-bottom:1.25rem'
                  : 'padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))'">
      <div class="mx-auto w-full max-w-2xl">

        <!-- ==================== KROK 1: WYKLUCZENIA ==================== -->
        <section x-show="krok === 'wykluczenia'" x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-2">
          <div class="space-y-2.5">
            <template x-for="w in WYKLUCZENIA" :key="w.id">
              <label class="flex min-h-[3.6rem] cursor-pointer items-center gap-4 rounded-2xl border
                            border-stone-100 bg-white px-5 shadow-sm transition
                            dark:border-stone-800 dark:bg-stone-900">
                <input type="checkbox" :value="w.id" x-model="wybraneWykluczenia"
                       class="size-6 shrink-0 accent-emerald-600 dark:accent-emerald-500">
                <span class="font-medium" x-text="w.etykieta"></span>
              </label>
            </template>
          </div>
          <button type="button" @click="pokazTalie()"
                  class="mt-5 flex min-h-[2.9rem] w-full items-center justify-center rounded-xl
                         bg-emerald-700 font-bold text-white transition active:scale-[0.98]
                         dark:bg-emerald-600">Pokaż dania</button>
        </section>

        <!-- Podpowiedź o dodaniu do ekranu głównego. Pokazuje się od trzeciego
             wejścia — wcześniej człowiek nie wie jeszcze, czy chce tę apkę. -->
        <div x-show="instalacja" x-transition
             class="mb-4 rounded-2xl border border-emerald-100 bg-emerald-50 p-5
                    dark:border-emerald-500/20 dark:bg-emerald-500/10">
          <h2 class="font-bold" x-text="instalacja?.tytul"></h2>
          <p class="mt-1 text-[0.82rem] leading-snug text-stone-600 dark:text-stone-400"
             x-text="instalacja?.tresc"></p>
          <div class="mt-3 flex gap-2">
            <button type="button" x-show="instalacja?.system === 'android' && mamyPropozycje()"
                    @click="zainstalujTeraz()"
                    class="flex min-h-[2.5rem] flex-1 items-center justify-center rounded-xl
                           bg-emerald-700 px-4 font-bold text-white dark:bg-emerald-600">
              Dodaj do ekranu
            </button>
            <button type="button" @click="ukryjInstalacje()"
                    class="flex min-h-[2.5rem] items-center justify-center rounded-xl border-2
                           border-emerald-700/20 px-4 text-[0.82rem] font-semibold
                           text-stone-600 dark:border-emerald-400/25 dark:text-stone-400">
              Nie teraz
            </button>
          </div>
        </div>

        <!-- ==================== KROK 2: TALIA ==================== -->
        <section x-show="krok === 'talia'" x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-2">

          <div x-show="laduje" class="szkielet rounded-2xl border border-stone-100 bg-white p-6
                                      shadow-sm dark:border-stone-800 dark:bg-stone-900">
            <div class="h-5 w-28 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            <div class="mt-4 h-7 w-4/5 rounded-lg bg-stone-200 dark:bg-stone-800"></div>
            <div class="mt-2 h-3 w-2/5 rounded-full bg-stone-200 dark:bg-stone-800"></div>
            <div class="mt-6 space-y-3">
              <template x-for="w in [72,58,80,46,64]" :key="w">
                <div class="h-3 rounded-full bg-stone-200 dark:bg-stone-800" :style="`width:${w}%`"></div>
              </template>
            </div>
          </div>

          <div x-show="!laduje && danie">
            <!-- Licznik i pasek zostają na wierzchu przy przewijaniu.
                 Na iPhonie 13 przy przewinięciu do przycisków „Lubię / Nie lubię”
                 znikały z ekranu — a to one mówią, ile zostało i po co to robimy.
                 Zgłoszone 3 sierpnia po teście na telefonie. -->
            <div class="sticky top-0 z-20 -mx-4 mb-3 bg-stone-50/95 px-4 pb-3 pt-1
                        backdrop-blur-md dark:bg-stone-950/95 md:-mx-8 md:px-8">

              <!-- Licznik pierwszych dań: subtelny, jedna linia. Znika po odblokowaniu. -->
              <div x-show="!odblokowane" class="mb-2 flex items-center gap-2.5">
                <span class="shrink-0 rounded-full bg-emerald-50 px-2.5 py-1 text-[0.82rem]
                             font-bold tabular-nums text-emerald-800
                             dark:bg-emerald-500/15 dark:text-emerald-300"
                      x-text="`${POTRZEBA_DAN - brakujeDan}/${POTRZEBA_DAN}`"></span>
                <p class="min-w-0 flex-1 truncate text-[0.82rem] text-stone-500 dark:text-stone-400"
                   x-text="zachetaKrotka"></p>
                <!-- Wyjaśnienie pod „i”, bo pełny tekst nie mieści się w jednej linii,
                     a zajmowanie trzech linii na stałe kosztuje więcej, niż daje. -->
                <button type="button" @click="pomocKlucz = 'dania'"
                        aria-label="Dlaczego warto przejrzeć więcej dań"
                        class="flex size-8 shrink-0 items-center justify-center rounded-full border
                               border-stone-300 text-[0.82rem] font-bold text-stone-500
                               dark:border-stone-600 dark:text-stone-400">i</button>
              </div>

              <div class="pasek" x-data="pasek" x-effect="ustaw(postep)"
                 :class="{ przyrost, gotowe }"
                 :style="`--postep:${postep}`"
                 role="progressbar" :aria-valuenow="postep" aria-valuemin="0" aria-valuemax="100"
                 :aria-label="`Przejrzano ${indeks} z ${talia.length} dań`">
              <i></i><u></u><b></b>
            </div>
            </div>

            <!-- KARTA W `x-if`, NIE W `x-show`. `x-show` tylko ukrywa element —
                 wyrażenia w środku są liczone tak czy inaczej, więc przy pustej talii
                 (dane jeszcze się wczytują albo wszystko już przejrzane) `danie` jest
                 `null` i pięć odczytów typu `danie.nazwa` rzucało wyjątkiem prosto
                 do konsoli. `x-if` nie renderuje zawartości w ogóle (decyzja 73). -->
            <template x-if="danie">
            <article class="relative overflow-hidden rounded-2xl border border-stone-100 bg-white
                            p-6 pt-7 shadow-md dark:border-stone-800 dark:bg-stone-900"
                     :class="odlot === 'tak' ? 'odlot-tak' : odlot === 'nie' ? 'odlot-nie'
                             : wjazd ? 'karta-wjazd' : ''">
              <!-- Pasek w kolorze kubełka: mówi, z jakiego świata jest danie,
                   zanim ktokolwiek przeczyta stempel. -->
              <span class="pasek-kubelka" :style="`background:${barwaCzasu(danie)}`"></span>

              <div class="flex items-start justify-between gap-3">
                <h2 class="text-[1.45rem] font-bold leading-[1.15] tracking-tight"
                    x-text="bezSierot(danie.nazwa)"></h2>
                <!-- Czas zamiast kategorii. Kubełki („domowa klasyka”, „nowoczesne”)
                     mieszały trzy różne osie i 45 dań ze 101 nie miało żadnego,
                     więc oznaczenia wyglądały na przypadkowe. Czas jest jednoznaczny,
                     dotyczy każdego dania i odpowiada na pytanie zadawane o 18:30. -->
                <span class="stempel-czasu mt-1 shrink-0"
                      :class="`stempel-czasu--${stanCzasu(danie)}`"
                      x-show="opisCzasu(danie)"><span x-text="minutyCzasu(danie)"></span><span
                      class="jednostka">min</span></span>
              </div>

              <!-- Kuchnia SŁOWEM, przy każdym daniu (decyzja 68). Flaga wypadła:
                   emoji nie renderuje się na Windowsie, czytnik ekranu czytał je
                   przed każdą nazwą, a jedna trzecia dań dostawała polską flagę
                   tylko dlatego, że żadna reguła nie trafiła. Teraz każde danie
                   ma kuchnię WPISANĄ, a dania bez kuchni narodowej — uniwersalną. -->
              <p class="mt-1.5 text-[0.68rem] font-extrabold uppercase tracking-[0.14em]
                        text-stone-400 dark:text-stone-500"
                 x-text="`kuchnia ${kuchniaDania(danie).nazwa}`"></p>

              <!-- Kontekst jednym wierszem: typy posiłku i liczba osób. -->
              <p class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1 text-[0.82rem]
                        text-stone-500 dark:text-stone-400">
                <template x-for="(t, i) in danie.typy" :key="t">
                  <span class="flex items-center gap-2">
                    <span x-show="i > 0" class="size-1 rounded-full bg-stone-300 dark:bg-stone-600"></span>
                    <span class="capitalize" x-text="t"></span>
                  </span>
                </template>
                <span class="size-1 rounded-full bg-stone-300 dark:bg-stone-600"></span>
                <span x-text="`na ${danie.porcje} os.`"></span>
                <span class="size-1 rounded-full bg-stone-300 dark:bg-stone-600"></span>
                <span x-text="`${danie.skladniki.length} składników`"></span>
                <!-- Marynowanie i moczenie nie liczą się do czasu w kuchni, ale
                     trzeba o nich wiedzieć zawczasu — inaczej człowiek wybiera
                     danie na dziś, a ono wymagało wczoraj. -->
                <span x-show="niewykonalne(danie)"
                      class="rounded-full bg-red-50 px-2 py-0.5 text-[0.68rem] font-semibold
                             text-red-800 dark:bg-red-400/15 dark:text-red-300">
                  wymaga piekarnika
                </span>
                <span x-show="!niewykonalne(danie) && powodyCzasu(danie).length"
                      class="text-[0.68rem] text-stone-400"
                      :title="powodyCzasu(danie).join('; ')"
                      x-text="`+ ${powodyCzasu(danie).length === 1 ? 'Wasz sprzęt' : 'Wasz sprzęt'}`"></span>
                <span x-show="wymagaWyprzedzenia(danie)"
                      class="rounded-full bg-amber-50 px-2 py-0.5 text-[0.68rem] font-semibold
                             text-amber-800 dark:bg-amber-400/15 dark:text-amber-300">
                  zacznij dzień wcześniej
                </span>
              </p>

              <!-- Składniki w dwóch kolumnach od szerokości tabletu — gęściej,
                   mniej przewijania, więcej widać naraz. -->
              <ul class="mt-5 sm:columns-2 sm:gap-x-6">
                <template x-for="s in danie.skladniki" :key="s.produkt">
                  <li class="flex items-baseline justify-between gap-3 break-inside-avoid py-1
                             text-[1rem]">
                    <span class="text-stone-600 dark:text-stone-400" x-text="s.produkt"></span>
                    <span class="shrink-0 font-semibold tabular-nums text-stone-800 dark:text-stone-200"
                          x-text="s.gramy + ' g'"></span>
                  </li>
                </template>
              </ul>
            </article>
            </template>

            <!-- Dwie drogi, nie jedna. Wcześniej ten przycisk prowadził wprost
                 do ręcznego formularza, z pominięciem AI — czyli tej drogi,
                 która ma być najczęstsza (link do przepisu albo zdjęcie strony
                 z książki). Człowiek trafiał na wpisywanie gramatury z palca
                 i nie dowiadywał się, że apka umie to zrobić za niego. -->
            <p class="mt-5 mb-2 text-center text-[0.82rem] text-stone-500 dark:text-stone-400">
              Nic z tego? Dodajcie swoje dania.
            </p>
            <div class="grid grid-cols-2 gap-2.5">
              <a href="dodaj-z-ai.html"
                 class="flex min-h-[2.9rem] items-center justify-center gap-2 rounded-xl border-2
                        border-emerald-600/40 bg-emerald-50 font-semibold text-emerald-800 no-underline
                        transition active:scale-[0.98] dark:border-emerald-500/30
                        dark:bg-emerald-500/10 dark:text-emerald-300">
                <svg class="ikona ikona-sm"><use href="#i-iskra"/></svg> Przez AI
              </a>
              <a href="formularz.html"
                 class="flex min-h-[2.9rem] items-center justify-center gap-2 rounded-xl border-2
                        border-dashed border-stone-300 font-semibold text-stone-600 no-underline
                        transition active:scale-[0.98] dark:border-stone-700 dark:text-stone-400">
                <svg class="ikona ikona-sm"><use href="#i-plus"/></svg> Ręcznie
              </a>
            </div>
          </div>

          <!-- Koniec talii -->
          <div x-show="!laduje && !danie" x-transition
               class="rounded-2xl border border-stone-100 bg-white p-8 text-center shadow-md
                      dark:border-stone-800 dark:bg-stone-900">
            <div class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-emerald-50
                        dark:bg-emerald-500/10">
              <svg class="ikona text-emerald-700 dark:text-emerald-400"><use href="#i-swieto"/></svg>
            </div>
            <h2 class="mt-4 text-xl font-bold" x-text="lubiane ? 'To wszystko na teraz' : 'Nic nie trafiło?'"></h2>
            <p class="mt-2 text-[1rem] text-stone-500 dark:text-stone-400"
               x-text="lubiane
                 ? `Polubiliście ${lubiane} dań. Wystarczy, żeby ułożyć jadłospis.`
                 : 'W porządku — te dania miały wystarczyć na start, nie być kompletne. Dodaj swoje.'"></p>
            <a x-show="lubiane" href="jadlospis.html"
               class="mt-5 flex min-h-[2.9rem] w-full items-center justify-center rounded-xl
                      bg-emerald-700 font-bold text-white no-underline dark:bg-emerald-600">
              Ułóż jadłospis
            </a>
            <div x-show="!lubiane" class="mt-5 grid gap-2.5">
              <a href="dodaj-z-ai.html"
                 class="flex min-h-[2.9rem] items-center justify-center gap-2 rounded-xl bg-emerald-700
                        font-bold text-white no-underline dark:bg-emerald-600">
                <svg class="ikona ikona-sm"><use href="#i-iskra"/></svg> Dodaj przez AI
              </a>
              <a href="formularz.html"
                 class="flex min-h-[2.9rem] items-center justify-center gap-2 rounded-xl border-2
                        border-stone-200 font-bold no-underline dark:border-stone-700">
                <svg class="ikona ikona-sm"><use href="#i-plus"/></svg> Wpisz ręcznie
              </a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- PRZYCISKI DECYZJI POZA OBSZAREM PRZEWIJANIA (decyzja 69).
         Stały tu wcześniej w normalnym układzie strony, tuż pod kartą przepisu —
         a karta rośnie i kurczy się razem z liczbą składników, więc przy 6 składnikach
         przyciski były wyżej niż przy 7. Na ekranie oglądanym setki razy i obsługiwanym
         kciukiem bez patrzenia to czuć jak usterkę: kciuk uczy się jednego miejsca,
         a apka je co danie przesuwa. Sekcja `shrink-0` poza `main` nie rusza się wraz
         z treścią — ten sam mechanizm co dolny pasek zakładek pod spodem. -->
    <div x-show="krok === 'talia' && !laduje && danie"
         class="shrink-0 border-t border-stone-200/70 bg-stone-50/95 px-4 pb-3 pt-3 backdrop-blur-xl
                dark:border-stone-800 dark:bg-stone-950/95">
      <div class="mx-auto w-full max-w-2xl">
        <!-- Dwa przyciski równej wagi. Żaden nie jest domyślny — to ma być
             realny wybór, nie potwierdzenie sugestii. -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" @click="zdecyduj('nie')"
                  class="flex min-h-[3.35rem] items-center justify-center gap-2 rounded-xl border-2
                         border-stone-200 bg-white font-bold text-stone-600 transition active:scale-95
                         dark:border-stone-700 dark:bg-stone-900 dark:text-stone-300">
            <svg class="ikona ikona-sm"><use href="#i-x"/></svg> Nie lubię
          </button>
          <button type="button" @click="zdecyduj('tak')"
                  class="flex min-h-[3.35rem] items-center justify-center gap-2 rounded-xl
                         bg-emerald-700 font-bold text-white shadow-sm transition active:scale-95
                         dark:bg-emerald-600">
            <svg class="ikona ikona-sm"><use href="#i-serce"/></svg> Lubię
          </button>
        </div>

        <button type="button" @click="cofnij()" x-show="historia.length" x-transition.opacity
                class="mt-2 flex min-h-[2.5rem] w-full items-center justify-center gap-2 rounded-xl
                       text-[0.82rem] font-semibold text-stone-500 dark:text-stone-400">
          <svg class="ikona ikona-sm"><use href="#i-cofnij"/></svg> Cofnij ostatnią
        </button>
      </div>
    </div>

    <nav class="shrink-0 border-t border-stone-200/70 bg-stone-50/95 backdrop-blur-xl md:hidden
                dark:border-stone-800 dark:bg-stone-950/95"
         style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Nawigacja główna">
      <div class="mx-auto flex h-16 max-w-lg">
        <template x-for="z in zakladki" :key="z.id">
          <a :href="zamknieta(z.id) ? 'talia.html' : z.plik"
             :aria-current="z.id === ekran ? 'page' : null"
             :aria-disabled="zamknieta(z.id) ? 'true' : null"
             :aria-label="zamknieta(z.id) ? `${z.nazwa} — otworzy się po ${brakujeDan} daniach` : null"             class="relative flex flex-1 flex-col items-center justify-center gap-0.5 text-[0.68rem]
                    font-semibold no-underline transition"
             :class="zamknieta(z.id) ? 'text-stone-300 dark:text-stone-700'
                     : z.id === ekran ? 'text-emerald-700 dark:text-emerald-400'
                                      : 'text-stone-500 dark:text-stone-400'">
            <svg class="ikona" :style="z.id === ekran ? 'stroke-width:2.4' : ''">
              <use :href="'#i-' + z.id"/></svg>
            <span x-text="z.nazwa"></span>
            <span x-show="z.id === ekran"
                  class="absolute bottom-1 size-1 rounded-full bg-emerald-600 dark:bg-emerald-400"></span>
          </a>
        </template>
      </div>
    </nav>
  </div>
</div>

<div x-show="toast" x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-end="opacity-0"
     class="pointer-events-none fixed inset-x-0 z-50 flex justify-center px-6"
     style="bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))">
  <p class="rounded-full bg-stone-900 px-5 py-3 text-center text-[0.82rem] font-semibold text-white
            shadow-xl dark:bg-stone-100 dark:text-stone-900" x-text="toast"></p>
</div>

<script type="module">
import Alpine from "./lib/alpine-esm.js";
import { polaczZBaza, kodStolu, pokazBrakStolu } from "./baza.js";
/* Uchwyty do bazy wypełniane w init() po udanym połączeniu. Deklarowane tutaj,
   bo używa ich cały ekran — a przypisywane dopiero wtedy, gdy SDK naprawdę się
   pobrał. Dopóki są puste, ekran działa na tym, co ma w pamięci telefonu. */
let db, ref, get, set, remove, push, update, onValue;

import { POMOC } from "./pomoc.js";
import { danePowloki, ding , zarejestrujPrzeciaganie , zarejestrujPasek } from "./powloka.js";
import { stanInstalacji, odrzuc, zainstaluj, mamyPropozycje } from "./instalacja.js";
import { stanPoczatkowy, zachetaPoczatkowa, zachetaKrotka, POTRZEBA_DAN } from "./postep.js";
import { WYKLUCZENIA, filtrujTalie } from "./wykluczenia.js";
import { progDlaSprzetu, opisCzasuDlaSprzetu, czasDlaSprzetu, wymagaWyprzedzenia }
  from "./czas.js";
import { kuchniaDania } from "./kuchnie.js";
import { TALIA_STARTOWA } from "./talia-startowa.js";


const kodDomu = kodStolu();

zarejestrujPrzeciaganie(Alpine);
zarejestrujPasek(Alpine);

Alpine.data("ekranDania", () => ({
  POMOC,
  pomocKlucz: null,

  ...danePowloki({
    ekran: "talia",
    tytul: "Wykluczenia",
    opis: "Zanim pokażę dania — czy jest coś, czego w ogóle nie jecie?",
  }),

  WYKLUCZENIA,
  krok: "wykluczenia",
  wybraneWykluczenia: [],
  laduje: true,
  talia: [],
  wlasne: [],
  indeks: 0,
  lubiane: 0,
  historia: [],
  odlot: null,
  /* Karta odlatuje przy decyzji, ale następna pojawiała się bez przejścia —
     przez ułamek sekundy nie było wiadomo, czy ekran zareagował. Wjazd domyka
     pętlę: coś odleciało, coś przyszło. */
  wjazd: false,
  seriaOdrzucen: 0,

  get danie() { return this.talia[this.indeks] || null; },

  zachetaTekst: "",
  zachetaKrotka: "",
  POTRZEBA_DAN,

  /* Licznik pierwszych dań — osobny od paska postępu talii. Pasek mówi, ile
     zostało do przejrzenia; ten mówi, ile brakuje do otwarcia reszty apki. */
  odswiezPostep() {
    const stan = stanPoczatkowy(this.preferencje);
    this.ustawOdblokowanie(stan);
    this.zachetaTekst = zachetaPoczatkowa(stan);
    this.zachetaKrotka = zachetaKrotka(stan);
  },
  get postep() { return this.talia.length ? Math.round(this.indeks / this.talia.length * 100) : 0; },

  instalacja: null,
  mamyPropozycje,

  async init() {
    try { await this.initEkranu(); }
    catch (e) {
      /* ZŁAPANY BŁĄD STARTU — ekran ma zostać użyteczny nawet wtedy, gdy
         odczyt z bazy albo cokolwiek innego padnie. Bez tego wyjątek przerywał
         init(), a wraz z nim znikało wszystko, co miało się wydarzyć niżej. */
      console.error("Błąd startu ekranu:", e);
      this.laduje = false;
      this.komunikat = "Coś nie zadziałało przy wczytywaniu.";
      this.mrugnij?.("Coś nie zadziałało. Spróbuj odświeżyć.");
    }
  },

  async initEkranu() {
    if (!kodDomu) { pokazBrakStolu(); return; }
    this.initPowloka();

    /* Połączenie z bazą PO starcie ekranu, nie przed. Gdy się nie uda, ekran
       zostaje użyteczny — pokazuje, co ma lokalnie, i mówi, że nie ma sieci. */
    const fb = await polaczZBaza();
    if (fb) ({ db, ref, get, set, remove, push, update, onValue } = fb);
    else {
      this.laduje = false;
      this.komunikat = "Brak połączenia z bazą.";
      this.mrugnij?.("Brak internetu — część rzeczy może nie działać.");
      return;
    }


    /* Chwila zwłoki: propozycja od Chrome przychodzi po załadowaniu strony,
       a bez niej przycisk „Dodaj” nie miałby czego wywołać. */
    setTimeout(() => { this.instalacja = stanInstalacji(); }, 1500);
    const [snapWykl, snapPref, snapWlasne, snapUst] = await Promise.all([
      get(ref(db, `domy/${kodDomu}/wykluczenia`)),
      get(ref(db, `domy/${kodDomu}/preferencje`)),
      get(ref(db, `domy/${kodDomu}/wlasneDania`)),
      get(ref(db, `domy/${kodDomu}/ustawienia`)),
    ]);
    /* Firebase NIE ZAPISUJE pustych tablic — `set(ref, [])` kasuje węzeł.
       Skutek: kto nic nie wykluczył, przy każdym wejściu dostawał to pytanie
       od nowa, bo `exists()` zwracało fałsz. Zgłoszone 3 sierpnia.

       Dlatego zapisujemy obiekt ze znacznikiem, a nie samą tablicę. Stary
       format (goła tablica) czytamy dalej, żeby nie zresetować tego nikomu,
       kto już przeszedł ten krok. */
    const wykl = snapWykl.val();
    this.wybraneWykluczenia = Array.isArray(wykl) ? wykl : (wykl?.lista || []);
    const juzUstawione = Array.isArray(wykl) || wykl?.ustawione === true;
    this.preferencje = snapPref.val() || {};
    this.odswiezPostep();
    this.wlasne = Object.entries(snapWlasne.val() || {}).map(([id, d]) => ({ id, ...d }));
    this.sprzet = (snapUst.val() || {}).kuchnia || null;

    /* Jeśli wykluczenia były już ustawione, pomijamy ten krok — nikt nie chce
       odpowiadać na to samo pytanie przy każdym wejściu. */
    if (juzUstawione) this.pokazTalie();
    else this.laduje = false;
  },

  async pokazTalie() {
    /* Znacznik `ustawione` jest jedynym powodem, dla którego to jest obiekt,
       a nie tablica — bez niego pusty wybór znika z bazy razem z informacją,
       że człowiek w ogóle odpowiedział na to pytanie. */
    await set(ref(db, `domy/${kodDomu}/wykluczenia`), {
      ustawione: true,
      lista: this.wybraneWykluczenia,
    });
    const wszystkie = [...TALIA_STARTOWA, ...this.wlasne];
    /* Pokazujemy tylko to, czego użytkownik jeszcze nie ocenił — inaczej po
       powrocie zaczynałby od początku i przesuwał te same dania. */
    this.talia = filtrujTalie(wszystkie, this.wybraneWykluczenia)
      .filter(d => !this.preferencje[d.id]);
    this.lubiane = Object.values(this.preferencje).filter(v => v === "lubie").length;
    this.krok = "talia";
    this.tytul = "Dania";
    this.opis = "Przesuwaj: to, co polubicie, trafi do jadłospisu.";
    this.laduje = false;
  },

  async zdecyduj(wybor) {
    const d = this.danie;
    if (!d) return;
    this.historia.push({ indeks: this.indeks, wybor, id: d.id });
    this.odlot = wybor;
    if (wybor === "tak") {
      this.lubiane++;
      this.seriaOdrzucen = 0;
      /* Pierwsze polubione danie — od tego momentu jadłospis ma z czego powstać. */
      if (this.lubiane === 1) this.mrugnij("Pierwsze danie na liście. Już się da z tego coś ułożyć.");
      if (this.lubiane === 25) this.mrugnij("Dwadzieścia pięć dań. Miesiąc bez powtórek.");
    }
    else {
      this.seriaOdrzucen++;
      /* Dziesięć odrzuceń z rzędu: mrugnięcie, nie wyrzut. Kto odrzuca dziesiąte
         danie, prawdopodobnie już się zastanawia, czy coś robi źle. */
      if (this.seriaOdrzucen === 10) this.mrugnij("Wybredny dziś jesteś.");
      /* Dwadzieścia pod rząd to już nie wybredność, tylko sygnał, że talia
         nie pasuje do tego domu — i lepiej powiedzieć to wprost. */
      if (this.seriaOdrzucen === 20) this.mrugnij("Może po prostu gotujecie inaczej. Dodaj swoje dania.");
    }
    navigator.vibrate?.(12);
    this.preferencje[d.id] = wybor === "tak" ? "lubie" : "nielubie";
    const bylZamkniety = !this.odblokowane;
    this.odswiezPostep();
    if (bylZamkniety && this.odblokowane)
      this.mrugnij("Jadłospis otwarty. Możesz układać plan albo przeglądać dalej.");
    set(ref(db, `domy/${kodDomu}/preferencje/${d.id}`), wybor === "tak" ? "lubie" : "nielubie");

    await new Promise(r => setTimeout(r, 300));
    this.odlot = null;
    this.indeks++;

    // Klasę trzeba zdjąć i nałożyć od nowa, inaczej animacja nie ruszy drugi raz.
    this.wjazd = false;
    this.$nextTick(() => { this.wjazd = true; });
    setTimeout(() => { this.wjazd = false; }, 260);
    this.komunikat = wybor === "tak" ? "Polubione" : "Pominięte";
    // Półmetek: jedyne miejsce, gdzie warto powiedzieć „jeszcze trochę”.
    if (this.indeks === Math.floor(this.talia.length / 2) && this.talia.length >= 20)
      this.mrugnij("Połowa za Wami.");

    if (this.indeks >= this.talia.length) ding();
  },

  cofnij() {
    const o = this.historia.pop();
    if (!o) return;
    this.indeks = o.indeks;
    if (o.wybor === "tak") this.lubiane--;
    this.seriaOdrzucen = 0;
    delete this.preferencje[o.id];
    this.odswiezPostep();
    set(ref(db, `domy/${kodDomu}/preferencje/${o.id}`), null);
    this.komunikat = "Cofnięto";
  },

  ukryjInstalacje() { odrzuc(); this.instalacja = null; },

  async zainstalujTeraz() {
    const zgoda = await zainstaluj();
    if (zgoda) { this.instalacja = null; this.mrugnij("Gotowe — Forkast jest na ekranie."); }
  },

  /* Barwa kubełka — jedno źródło prawdy dla paska, stempla i kropek
     w jadłospisie. Danie bez kubełka dostaje neutralny kamień, nie zieleń,
     żeby zieleń została zarezerwowana dla akcji i postępu. */
  wymagaWyprzedzenia, kuchniaDania,
  sprzet: null,

  /* Barwa progu czasowego — jedno źródło prawdy dla paska i stempla.
     Ciemny motyw ma własne barwy, bo tamte na ciemnym tle dają około 2:1. */
  /* Wszystkie trzy funkcje czasu biorą sprzęt użytkownika. Gdy nie ustawił —
     null i modul podstawia domyślne, bo większość ludzi nigdy nie wejdzie
     w Ustawienia, a apka musi działać bez tej informacji. */
  opisCzasu(d) { return opisCzasuDlaSprzetu(d, this.sprzet); },
  niewykonalne(d) { return czasDlaSprzetu(d, this.sprzet).niewykonalne; },
  powodyCzasu(d) { return czasDlaSprzetu(d, this.sprzet).powody; },

  barwaCzasu(d) {
    const p = progDlaSprzetu(d, this.sprzet);
    if (!p) return "var(--kubelek-brak)";
    return document.documentElement.classList.contains("dark") ? p.barwaCiemna : p.barwa;
  },

  /* Pieczątka czasu bierze KLASĘ, nie kolor wstawiany w `style`. Kolor w `style`
     nie umie zareagować na przełączenie motywu bez przerysowania listy, a klasa
     umie — `.dark` na elemencie nadrzędnym przełącza obie palety naraz.
     Wartości i wyliczone kontrasty stoją przy `.stempel-czasu` w `styl.css`. */
  stanCzasu(d) {
    return progDlaSprzetu(d, this.sprzet)?.id || "brak";
  },

  /* Sama liczba, bez jednostki — jednostka jest osobnym, mniejszym elementem
     w pieczątce, więc nie może przyjechać sklejona z liczbą. */
  minutyCzasu(d) {
    return (opisCzasuDlaSprzetu(d, this.sprzet) || "").replace(" min", "");
  },

  /* Stempel mówi, z jakiego świata gotowania pochodzi danie. Nie jest kategorią
     techniczną, tylko podpowiedzią: babcia gotuje inaczej niż ktoś, kto wraca
     do domu o dziewiętnastej. Starsze dania go nie mają i nie dorabiamy im go. */
  stempel(k) {
    return ({
      "domowa klasyka": "bg-amber-50 text-amber-800 dark:bg-amber-400/10 dark:text-amber-300",
      "nowoczesne": "bg-emerald-50 text-emerald-800 dark:bg-emerald-400/10 dark:text-emerald-300",
      "szybkie": "bg-sky-50 text-sky-800 dark:bg-sky-400/10 dark:text-sky-300",
      "świat": "bg-fuchsia-50 text-fuchsia-800 dark:bg-fuchsia-400/10 dark:text-fuchsia-300",
    })[k] || "bg-stone-100 text-stone-600 dark:bg-stone-800 dark:text-stone-300";
  },
}));

window.Alpine = Alpine;
Alpine.start();

/* Sprite ikon i okienko pomocy dociągane PO starcie Alpine, nie przed.

   Wcześniej były przed — z `await` na górnym poziomie modułu. Skutek: jeśli
   którekolwiek pobranie zawisło (a service worker potrafi zawiesić żądanie
   przy zerwanej sieci), `Alpine.start()` nigdy się nie wykonywał, `x-cloak`
   nigdy nie schodził i człowiek dostawał BIAŁY EKRAN.

   Ikony pojawiające się o pół sekundy później to koszt, którego nikt nie
   zauważy. Biały ekran to koszt, po którym nikt nie wraca.

   Limit czasu, bo `fetch` bez niego potrafi czekać w nieskończoność. */
(async () => {
  const pobierz = (plik) => Promise.race([
    fetch(plik).then(r => r.text()),
    new Promise((_, odrzuc) => setTimeout(() => odrzuc(new Error("limit czasu")), 5000)),
  ]);
  for (const [id, plik] of [["ikony", "ikony.html"], ["pomoc", "pomoc.html"]]) {
    const cel = document.getElementById(id);
    if (!cel) continue;
    try { cel.innerHTML = await pobierz(plik); }
    catch (e) { console.warn(`Nie udało się wczytać ${plik}:`, e); }
  }
})();
</script>

<script>
/* BEZPIECZNIK BIAŁEGO EKRANU

   `x-cloak` ukrywa całą stronę, dopóki Alpine nie przejmie kontroli. Gdy Alpine
   wywali się przy starcie — bo padł import, bo sieć zerwała moduł, bo cokolwiek —
   atrybut nigdy nie znika i człowiek dostaje BIAŁY EKRAN bez żadnej informacji.
   Nie ma wtedy nawet przycisku, żeby wyjść.

   Po dwóch sekundach zdejmujemy zasłonę siłą i pokazujemy, co się stało, razem
   z dwiema drogami wyjścia. Lepszy nieostylowany ekran z komunikatem niż biel.

   Dwie sekundy: Alpine startuje w ~200 ms nawet na starym telefonie przy zimnym
   cache, więc jeśli po dwóch go nie ma, to go nie będzie. */
(function () {
  var start = Date.now();
  setTimeout(function () {
    if (!window.Alpine) {
      document.body.removeAttribute("x-cloak");
      var box = document.createElement("div");
      box.setAttribute("style",
        "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;" +
        "align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;" +
        "background:#fafaf9;color:#292524;font:16px/1.5 -apple-system,system-ui,sans-serif");
      box.innerHTML =
        '<p style="font-size:20px;font-weight:700;margin:0">Coś się zacięło przy starcie</p>' +
        '<p style="margin:0;max-width:32ch;color:#57534e">Aplikacja nie zdążyła się uruchomić. ' +
        'Najczęściej pomaga pobranie jej od nowa.</p>' +
        '<button id="fk-reset" style="min-height:52px;padding:0 24px;border:0;border-radius:12px;' +
        'background:#047857;color:#fff;font-weight:700;font-size:16px">Pobierz od nowa</button>' +
        '<a href="index.html" style="color:#047857;font-size:14px">Wróć na początek</a>' +
        '<p style="margin:0;font-size:12px;color:#a8a29e">czas: ' + (Date.now() - start) + ' ms</p>';
      document.body.appendChild(box);
      document.getElementById("fk-reset").onclick = function () {
        if (window.caches) caches.keys().then(function (k) { k.forEach(function (x) { caches.delete(x); }); });
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
          .then(function (r) { r.forEach(function (x) { x.unregister(); }); });
        setTimeout(function () { location.reload(true); }, 300);
      };
    }
  }, 2000);
})();
</script>

<script>
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
