<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forkast">
<title>Dodaj danie — Forkast</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikona.svg">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<script src="lib/tailwind.js"></script>
<!-- Ta jedna deklaracja MUSI być tutaj, nie w styl.css.
     Przeglądarkowy Tailwind kompiluje wyłącznie bloki <style type="text/tailwindcss">
     w dokumencie — w zewnętrznym arkuszu jest ignorowana, a wtedy `dark:` działa
     po ustawieniu systemu i przełącznik w Ustawieniach nic nie zmienia. -->
<style type="text/tailwindcss">@custom-variant dark (&:where(.dark, .dark *));</style>
<link rel="stylesheet" href="styl.css">
</head>

<body class="h-full bg-stone-50 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-100"
      x-data="ekranFormularz" x-init="init()" x-cloak>

<div id="ikony"></div>
<p aria-live="polite" class="sr-only" x-text="komunikat"></p>

<div class="flex h-dvh flex-col overflow-hidden md:flex-row">

  <nav class="hidden shrink-0 flex-col gap-1.5 border-r border-stone-200/70 bg-white p-5
              md:flex md:w-60 lg:w-64 dark:border-stone-800 dark:bg-stone-900"
       aria-label="Nawigacja główna">
    <p class="mb-4 border-b border-stone-100 pb-5 text-lg font-black tracking-tight
              text-emerald-700 dark:border-stone-800 dark:text-emerald-400">Forkast</p>
    <template x-for="z in zakladki" :key="z.id">
      <a :href="zamknieta(z.id) ? 'talia.html' : z.plik"
         :aria-disabled="zamknieta(z.id) ? 'true' : null"
         class="flex h-12 items-center gap-3 rounded-xl px-3.5 no-underline transition
                hover:bg-stone-100 dark:hover:bg-stone-800"
         :class="zamknieta(z.id) ? 'text-stone-300 dark:text-stone-700'
                                 : 'text-stone-500 dark:text-stone-400'">
        <svg class="ikona"><use :href="'#i-' + z.id"/></svg>
        <span x-text="z.nazwa"></span>
      </a>
    </template>
    <a href="ustawienia.html"
       class="mt-1 flex h-12 items-center gap-3 rounded-xl px-3.5 text-stone-500 no-underline
              transition hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800">
      <svg class="ikona"><use href="#i-ustawienia"/></svg>
      <span>Ustawienia</span>
    </a>
  </nav>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col">

    <header class="relative shrink-0 overflow-hidden rounded-b-[1.75rem] bg-gradient-to-br
                   from-emerald-600 via-emerald-700 to-emerald-800 px-5 text-white
                   shadow-lg shadow-emerald-900/20 md:rounded-none"
            style="padding-top:calc(1.15rem + env(safe-area-inset-top,0px)); padding-bottom:1.4rem">
      <p class="text-[0.55rem] font-extrabold uppercase tracking-[0.24em] text-white/80">Forkast</p>
      <h1 class="mt-1.5 text-[1.65rem] font-bold leading-tight tracking-tight">Dodaj danie</h1>
      <p class="mt-1 max-w-[36ch] text-[0.85rem] leading-snug text-white/85">
        Bez AI — po prostu to, co i tak gotujecie.
      </p>
      <a href="ustawienia.html" aria-label="Ustawienia"
         class="absolute flex size-11 items-center justify-center rounded-full border
                border-white/35 bg-white/15 text-white no-underline backdrop-blur-md
                transition active:scale-95"
         style="top:calc(0.9rem + env(safe-area-inset-top,0px)); right:1rem">
        <svg class="ikona ikona-sm"><use href="#i-ustawienia"/></svg>
      </a>
    </header>

    <main class="plynne bez-paska min-h-0 flex-1 overflow-y-auto scroll-smooth px-4 pt-5 md:px-8"
          style="padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))">
      <div class="mx-auto w-full max-w-lg">

        <!-- ================= FORMULARZ ================= -->
        <div x-show="!zapisane" x-transition class="space-y-5">

          <div>
            <label for="nazwa" class="mb-2 block text-[0.9rem] font-semibold">Nazwa dania</label>
            <input id="nazwa" type="text" x-model="nazwa" autocomplete="off"
                   class="min-h-[52px] w-full rounded-xl border-2 border-stone-200 bg-white px-4
                          text-[17px] outline-none transition focus:border-emerald-600
                          focus:ring-4 focus:ring-emerald-500/15
                          dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
          </div>

          <div>
            <p class="mb-2 text-[0.9rem] font-semibold">Typ posiłku <span class="font-normal text-stone-400">(można wybrać kilka)</span></p>
            <div class="flex flex-wrap gap-2" role="group" aria-label="Typ posiłku">
              <template x-for="t in TYPY_POSILKOW" :key="t">
                <button type="button" @click="przelaczTyp(t)" :aria-pressed="typy.includes(t).toString()"
                        class="min-h-[48px] rounded-full border-2 px-5 font-semibold capitalize transition active:scale-95"
                        :class="typy.includes(t)
                          ? 'border-emerald-700 bg-emerald-700 text-white dark:border-emerald-500 dark:bg-emerald-500'
                          : 'border-stone-200 dark:border-stone-700'">
                  <span x-text="t"></span>
                </button>
              </template>
            </div>
          </div>

          <div>
            <label for="porcje" class="mb-2 block text-[0.9rem] font-semibold">
              Na ile osób jest ta gramatura
            </label>
            <input id="porcje" type="number" min="1" max="20" x-model.number="porcje"
                   class="min-h-[52px] w-full rounded-xl border-2 border-stone-200 bg-white px-4
                          text-[17px] outline-none transition focus:border-emerald-600
                          focus:ring-4 focus:ring-emerald-500/15
                          dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
          </div>

          <div>
            <p class="mb-2 text-[0.9rem] font-semibold">Składniki</p>
            <div class="space-y-2.5">
              <template x-for="(s, i) in skladniki" :key="i">
                <div class="flex gap-2">
                  <input type="text" x-model="s.produkt" :list="'produkty-' + i" placeholder="Produkt"
                         class="min-h-[52px] flex-1 rounded-xl border-2 border-stone-200 bg-white px-4
                                text-[17px] outline-none transition focus:border-emerald-600
                                dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
                  <input type="number" x-model.number="s.gramy" placeholder="gramy" min="1"
                         class="min-h-[52px] w-28 rounded-xl border-2 border-stone-200 bg-white px-3
                                text-[17px] outline-none transition focus:border-emerald-600
                                dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
                  <button type="button" @click="skladniki.splice(i, 1)"
                          :aria-label="'Usuń składnik ' + (i + 1)"
                          class="flex size-[52px] shrink-0 items-center justify-center rounded-xl
                                 text-stone-400 transition active:bg-stone-100 dark:active:bg-stone-800">
                    <svg class="ikona ikona-sm"><use href="#i-x"/></svg>
                  </button>
                </div>
              </template>
            </div>

            <!-- Podpowiedzi ze słownika: nazwa musi trafić dokładnie, bo z niej
                 liczy się listę zakupów. Wpisana z palca literówka tworzy
                 osobny produkt i rozbija sumowanie. -->
            <datalist id="produkty-0"></datalist>
            <template x-for="(s, i) in skladniki" :key="'dl' + i">
              <datalist :id="'produkty-' + i">
                <template x-for="p in slownik" :key="p.n">
                  <option :value="p.n"></option>
                </template>
              </datalist>
            </template>

            <button type="button" @click="skladniki.push({ produkt: '', gramy: null })"
                    class="mt-2.5 flex min-h-[52px] w-full items-center justify-center gap-2 rounded-xl
                           border-2 border-dashed border-stone-300 font-semibold text-stone-600
                           transition active:scale-[0.98] dark:border-stone-700 dark:text-stone-400">
              <svg class="ikona ikona-sm"><use href="#i-plus"/></svg> Dodaj składnik
            </button>
          </div>

          <div x-show="bledy.length" x-transition
               class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[0.88rem] text-red-800
                      dark:border-red-800/50 dark:bg-red-900/25 dark:text-red-200">
            <template x-for="b in bledy" :key="b"><p x-text="b"></p></template>
          </div>

          <!-- Droga w drugą stronę. Kto trafił tu z Dań i zobaczył, że trzeba
               wpisywać gramaturę z palca, powinien wiedzieć, że AI zrobi to
               z linku albo ze zdjęcia strony z książki. -->
          <a href="dodaj-z-ai.html"
             class="flex min-h-[52px] w-full items-center justify-center gap-2 rounded-xl
                    border-2 border-emerald-600/40 bg-emerald-50 font-semibold text-emerald-800
                    no-underline transition active:scale-[0.98] dark:border-emerald-500/30
                    dark:bg-emerald-500/10 dark:text-emerald-300">
            <svg class="ikona ikona-sm"><use href="#i-iskra"/></svg>
            Wolisz, żeby AI to wypełniło?
          </a>

          <button type="button" @click="zapisz()" :disabled="zapisywanie"
                  class="flex min-h-[52px] w-full items-center justify-center rounded-xl bg-emerald-700
                         font-bold text-white transition active:scale-[0.98] disabled:opacity-50
                         dark:bg-emerald-600"
                  x-text="zapisywanie ? 'Zapisuję…' : 'Zapisz danie'"></button>
        </div>

        <!-- ================= PO ZAPISIE ================= -->
        <div x-show="zapisane" x-transition
             class="rounded-2xl border border-stone-100 bg-white p-8 text-center shadow-md
                    dark:border-stone-800 dark:bg-stone-900">
          <div class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-emerald-50
                      dark:bg-emerald-500/10">
            <svg class="ikona text-emerald-700 dark:text-emerald-400"><use href="#i-ptaszek"/></svg>
          </div>
          <h2 class="mt-4 text-xl font-bold">Dodane!</h2>
          <p class="mt-2 text-[0.9rem] text-stone-500 dark:text-stone-400">
            Danie trafiło do Waszych dań jako polubione.
          </p>
          <button type="button" @click="odNowa()"
                  class="mt-5 flex min-h-[52px] w-full items-center justify-center rounded-xl
                         bg-emerald-700 font-bold text-white dark:bg-emerald-600">Dodaj kolejne</button>
          <a href="talia.html" class="mt-2.5 flex min-h-[52px] w-full items-center justify-center
             rounded-xl border-2 border-stone-200 font-bold no-underline
             dark:border-stone-700">Wróć do dań</a>
        </div>
      </div>
    </main>

    <nav class="shrink-0 border-t border-stone-200/70 bg-stone-50/95 backdrop-blur-xl md:hidden
                dark:border-stone-800 dark:bg-stone-950/95"
         style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Nawigacja główna">
      <div class="mx-auto flex h-16 max-w-lg">
        <template x-for="z in zakladki" :key="z.id">
          <a :href="zamknieta(z.id) ? 'talia.html' : z.plik"
             :aria-disabled="zamknieta(z.id) ? 'true' : null"
             class="relative flex flex-1 flex-col items-center justify-center gap-0.5 text-[0.56rem]
                    font-semibold no-underline transition"
             :class="zamknieta(z.id) ? 'text-stone-300 dark:text-stone-700'
                                     : 'text-stone-500 dark:text-stone-400'">
            <svg class="ikona"><use :href="'#i-' + z.id"/></svg>
            <span x-text="z.nazwa"></span>
          </a>
        </template>
      </div>
    </nav>
  </div>
</div>

<script type="module">
import Alpine from "./lib/alpine-esm.js";
import { polaczZBaza, kodStolu, pokazBrakStolu } from "./baza.js";
/* Uchwyty do bazy wypełniane w init() po udanym połączeniu. Deklarowane tutaj,
   bo używa ich cały ekran — a przypisywane dopiero wtedy, gdy SDK naprawdę się
   pobrał. Dopóki są puste, ekran działa na tym, co ma w pamięci telefonu. */
let db, ref, get, set, remove, push, update, onValue;

import { stanPoczatkowy } from "./postep.js";
import { danePowloki } from "./powloka.js";
import { walidujDanie } from "./formularz.js";
import { PRODUKTY } from "./produkty.js";
import { TYPY_POSILKOW } from "./prompt.js";


const kodDomu = kodStolu();

Alpine.data("ekranFormularz", () => ({
  ...danePowloki({ ekran: "formularz", tytul: "Dodaj danie", opis: "" }),

  TYPY_POSILKOW,
  slownik: [],
  nazwa: "",
  typy: [],
  porcje: 2,
  skladniki: [{ produkt: "", gramy: null }, { produkt: "", gramy: null }],
  bledy: [],
  zapisywanie: false,
  zapisane: false,

  async init() {
    try { await this.initEkranu(); }
    catch (e) {
      /* ZŁAPANY BŁĄD STARTU — ekran ma zostać użyteczny nawet wtedy, gdy
         odczyt z bazy albo cokolwiek innego padnie. Bez tego wyjątek przerywał
         init(), a wraz z nim znikało wszystko, co miało się wydarzyć niżej. */
      console.error("Błąd startu ekranu:", e);
      this.laduje = false;
      this.komunikat = "Coś nie zadziałało przy wczytywaniu.";
      this.mrugnij?.("Coś nie zadziałało. Spróbuj odświeżyć.");
    }
  },

  async initEkranu() {
    if (!kodDomu) { pokazBrakStolu(); return; }
    this.initPowloka();

    /* Połączenie z bazą PO starcie ekranu, nie przed. Gdy się nie uda, ekran
       zostaje użyteczny — pokazuje, co ma lokalnie, i mówi, że nie ma sieci. */
    const fb = await polaczZBaza();
    if (fb) ({ db, ref, get, set, remove, push, update, onValue } = fb);
    else {
      this.laduje = false;
      this.komunikat = "Brak połączenia z bazą.";
      this.mrugnij?.("Brak internetu — część rzeczy może nie działać.");
      return;
    }


    const [snap, snapPref] = await Promise.all([
      get(ref(db, `domy/${kodDomu}/produktyWlasne`)),
      get(ref(db, `domy/${kodDomu}/preferencje`)),
    ]);
    this.ustawOdblokowanie(stanPoczatkowy(snapPref.val() || {}));
    this.slownik = [...PRODUKTY, ...Object.values(snap.val() || {})]
      .sort((a, b) => a.n.localeCompare(b.n, "pl"));
  },

  przelaczTyp(t) {
    this.typy = this.typy.includes(t) ? this.typy.filter(x => x !== t) : [...this.typy, t];
  },

  async zapisz() {
    /* Walidacja w module, nie tutaj — te same reguły obowiązują dania z AI,
       więc nie mogą istnieć w dwóch kopiach. */
    const wynik = walidujDanie({
      nazwa: this.nazwa,
      typy: this.typy,
      porcje: this.porcje,
      skladniki: this.skladniki,
    }, this.slownik);

    /* walidujDanie zwraca { ok, danie } przy powodzeniu i { ok:false, bledy }
       przy błędach — pole `bledy` istnieje tylko w drugim przypadku. */
    if (!wynik.ok) { this.bledy = wynik.bledy || []; return; }
    this.bledy = [];

    this.zapisywanie = true;
    try {
      const nowyRef = push(ref(db, `domy/${kodDomu}/wlasneDania`));
      await set(nowyRef, wynik.danie);
      /* Własne danie od razu polubione: nikt nie wpisuje ręcznie czegoś,
         czego nie chce jeść. */
      await set(ref(db, `domy/${kodDomu}/preferencje/${nowyRef.key}`), "lubie");
      this.zapisane = true;
      this.komunikat = "Danie dodane";
      /* Jeden składnik. Czasem to naprawdę wszystko, czego trzeba. */
      if (wynik.danie.skladniki.length === 1)
        this.mrugnij("Jeden składnik. Szanujemy minimalizm.");
    } catch {
      this.bledy = ["Nie udało się zapisać — sprawdź internet i spróbuj ponownie."];
    } finally {
      this.zapisywanie = false;
    }
  },

  odNowa() {
    this.nazwa = ""; this.typy = []; this.porcje = 2;
    this.skladniki = [{ produkt: "", gramy: null }, { produkt: "", gramy: null }];
    this.bledy = []; this.zapisane = false;
  },
}));

window.Alpine = Alpine;
Alpine.start();

/* Sprite ikon i okienko pomocy dociągane PO starcie Alpine, nie przed.

   Wcześniej były przed — z `await` na górnym poziomie modułu. Skutek: jeśli
   którekolwiek pobranie zawisło (a service worker potrafi zawiesić żądanie
   przy zerwanej sieci), `Alpine.start()` nigdy się nie wykonywał, `x-cloak`
   nigdy nie schodził i człowiek dostawał BIAŁY EKRAN.

   Ikony pojawiające się o pół sekundy później to koszt, którego nikt nie
   zauważy. Biały ekran to koszt, po którym nikt nie wraca.

   Limit czasu, bo `fetch` bez niego potrafi czekać w nieskończoność. */
(async () => {
  const pobierz = (plik) => Promise.race([
    fetch(plik).then(r => r.text()),
    new Promise((_, odrzuc) => setTimeout(() => odrzuc(new Error("limit czasu")), 5000)),
  ]);
  for (const [id, plik] of [["ikony", "ikony.html"], ["pomoc", "pomoc.html"]]) {
    const cel = document.getElementById(id);
    if (!cel) continue;
    try { cel.innerHTML = await pobierz(plik); }
    catch (e) { console.warn(`Nie udało się wczytać ${plik}:`, e); }
  }
})();
</script>

<script>
/* BEZPIECZNIK BIAŁEGO EKRANU

   `x-cloak` ukrywa całą stronę, dopóki Alpine nie przejmie kontroli. Gdy Alpine
   wywali się przy starcie — bo padł import, bo sieć zerwała moduł, bo cokolwiek —
   atrybut nigdy nie znika i człowiek dostaje BIAŁY EKRAN bez żadnej informacji.
   Nie ma wtedy nawet przycisku, żeby wyjść.

   Po dwóch sekundach zdejmujemy zasłonę siłą i pokazujemy, co się stało, razem
   z dwiema drogami wyjścia. Lepszy nieostylowany ekran z komunikatem niż biel.

   Dwie sekundy: Alpine startuje w ~200 ms nawet na starym telefonie przy zimnym
   cache, więc jeśli po dwóch go nie ma, to go nie będzie. */
(function () {
  var start = Date.now();
  setTimeout(function () {
    if (!window.Alpine) {
      document.body.removeAttribute("x-cloak");
      var box = document.createElement("div");
      box.setAttribute("style",
        "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;" +
        "align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;" +
        "background:#fafaf9;color:#292524;font:16px/1.5 -apple-system,system-ui,sans-serif");
      box.innerHTML =
        '<p style="font-size:20px;font-weight:700;margin:0">Coś się zacięło przy starcie</p>' +
        '<p style="margin:0;max-width:32ch;color:#57534e">Aplikacja nie zdążyła się uruchomić. ' +
        'Najczęściej pomaga pobranie jej od nowa.</p>' +
        '<button id="fk-reset" style="min-height:52px;padding:0 24px;border:0;border-radius:12px;' +
        'background:#047857;color:#fff;font-weight:700;font-size:16px">Pobierz od nowa</button>' +
        '<a href="index.html" style="color:#047857;font-size:14px">Wróć na początek</a>' +
        '<p style="margin:0;font-size:12px;color:#a8a29e">czas: ' + (Date.now() - start) + ' ms</p>';
      document.body.appendChild(box);
      document.getElementById("fk-reset").onclick = function () {
        if (window.caches) caches.keys().then(function (k) { k.forEach(function (x) { caches.delete(x); }); });
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
          .then(function (r) { r.forEach(function (x) { x.unregister(); }); });
        setTimeout(function () { location.reload(true); }, 300);
      };
    }
  }, 2000);
})();
</script>

<script>
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
